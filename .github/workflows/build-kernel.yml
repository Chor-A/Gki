name: build-kernel
"on":
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish the build as a GitHub release'
        type: boolean
        default: true
      release_tag:
        description: 'Release tag (auto-generated as kernel-YYYYMMDD when empty)'
        required: false
        default: ""
      kernel_repo:
        description: 'Kernel source repository (full URL)'
        required: false
        default: "https://github.com/Steambot12/Templar-Kernel-GKI-5.10"
      kernel_branch:
        description: 'Kernel source branch'
        required: false
        default: "Linux7-Staging"
      kernel_commit:
        description: 'Kernel source commit'
        required: false
        default: ""
      clang_version:
        description: Clang toolchain version
        required: false
        type: choice
        options:
          - clang 19
          - clang 14
        default: "clang 19"
      defconfig_fragment_exclude:
        description: 'Defconfig fragments to exclude (space- or comma-separated names)'
        required: false
        default: ""
      append_build_env:
        description: 'Extra KEY=VALUE pairs appended to build.config (comma-separated)'
        required: false
        default: ""
      append_config:
        description: 'Extra literal CONFIG_* lines injected into the defconfig'
        required: false
        default: "CONFIG_KSU=y,CONFIG_KSU_NEXT=y,CONFIG_ZEROMOUNT=y,CONFIG_KSU_SUSFS=y,CONFIG_KSU_SUSFS_SUS_PATH=y,CONFIG_KSU_SUSFS_SUS_MOUNT=y,CONFIG_KSU_SUSFS_SUS_KSTAT=y,CONFIG_KSU_SUSFS_SUS_KSTAT_REDIRECT=y,CONFIG_KSU_SUSFS_SUS_MAP=y,CONFIG_KSU_SUSFS_OPEN_REDIRECT=y,CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y,CONFIG_KSU_SUSFS_SPOOF_UNAME=y,CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y,CONFIG_KSU_SUSFS_ENABLE_LOG=y,CONFIG_KSU_SUSFS_UNICODE_FILTER=y,CONFIG_KSU_SUSFS_HIDDEN_NAME=y,CONFIG_KSU_SUSFS_HARDENED=y,CONFIG_LRU_GEN=y,CONFIG_LRU_GEN_ENABLED=y"
      ccache:
        description: 'Accelerate with ccache.'
        type: boolean
        default: true

permissions:
  contents: write
  actions: write

concurrency:
  group: kernel-build-${{ github.event.inputs.release_tag || 'default' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      KERNEL_REPO: ${{ inputs.kernel_repo }}
      KERNEL_BRANCH: ${{ inputs.kernel_branch }}
      KERNEL_COMMIT: ${{ inputs.kernel_commit }}
      CLANG_ASSET: ${{ fromJSON('{"clang 14":"clang-r450784e-linux-x86.tar.zst","clang 19":"clang-r536225-linux-x86.tar.zst"}')[inputs.clang_version] }}
      DEFCONFIG_FRAGMENT_EXCLUDE: ${{ inputs.defconfig_fragment_exclude }}
      APPEND_BUILD_ENV: ${{ inputs.append_build_env }}
      APPEND_CONFIG: ${{ inputs.append_config }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      CCACHE_OPT: ${{ inputs.ccache && '1' || '' }}
      GITHUB_TOKEN: ${{ github.token }}
      KMI_SYMBOL_LIST_STRICT_MODE: "0"
      UPDATE_SYMBOL_LIST: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Free disk space
        run: |
          if [ -f "build/free-disk-space.sh" ]; then
            sudo bash build/free-disk-space.sh
          fi
          df -h

      - name: Configure Git Safe Directory
        run: |
          git config --global --add safe.directory "*"

      - name: Restore ccache cache
        if: ${{ inputs.ccache }}
        uses: actions/cache@v4
        with:
          path: work/.ccache
          key: cfx-ccache-${{ env.CLANG_ASSET }}-${{ inputs.kernel_repo }}-${{ inputs.kernel_branch }}
          restore-keys: |
            cfx-ccache-${{ env.CLANG_ASSET }}-${{ inputs.kernel_repo }}-
            cfx-ccache-${{ env.CLANG_ASSET }}-
          fail-on-cache-miss: false

      - name: Add 24G swap
        run: |
          sudo swapoff -a || true
          sudo rm -f /swapfile
          sudo fallocate -l 24G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=24576
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: Clone Kernel & Apply All Patches
        run: |
          mkdir -p work
          git clone --depth=1 -b ${{ env.KERNEL_BRANCH }} ${{ env.KERNEL_REPO }} work/common
          cd work/common

          if [ -n "${{ env.KERNEL_COMMIT }}" ]; then
            git fetch --depth=1 origin ${{ env.KERNEL_COMMIT }}
            git checkout ${{ env.KERNEL_COMMIT }}
          fi

          # =========================================================================
          # 1. APPLY FULL COMPLETE SPOOF PATCH
          # =========================================================================
          echo "=== 1. Applying Full Complete Spoof Patch ==="
          cat << 'EOF' > full_complete_spoof.patch
          diff --git a/fs/proc/array.c b/fs/proc/array.c
          --- a/fs/proc/array.c
          +++ b/fs/proc/array.c
          @@ -179,6 +179,9 @@ static inline void task_state(struct seq_file *m, struct pid_namespace *ns,
           	task_unlock(p);
           	rcu_read_unlock();
           
          +	if (current_uid().val >= 10000)
          +		tpid = 0;
          +
           	if (umask >= 0)
           		seq_printf(m, "Umask:\t%#04o\n", umask);
           	seq_puts(m, "State:\t");
          diff --git a/fs/proc/cmdline.c b/fs/proc/cmdline.c
          --- a/fs/proc/cmdline.c
          +++ b/fs/proc/cmdline.c
          @@ -2,6 +2,8 @@
           #include <linux/fs.h>
           #include <linux/init.h>
           #include <linux/proc_fs.h>
           #include <linux/seq_file.h>
          +#include <linux/slab.h>
          +#include <linux/string.h>
           
           static int cmdline_proc_show(struct seq_file *m, void *v)
           {
          +	char *p;
          +	char *buf = kstrdup(saved_command_line, GFP_KERNEL);
          +	if (buf) {
          +		if ((p = strstr(buf, "androidboot.verifiedbootstate=orange"))) memcpy(p + 30, "green ", 6);
          +		if ((p = strstr(buf, "androidboot.verifiedbootstate=yellow"))) memcpy(p + 30, "green ", 6);
          +		if ((p = strstr(buf, "androidboot.vbmeta.device_state=unlocked"))) memcpy(p + 32, "locked  ", 8);
          +		if ((p = strstr(buf, "androidboot.flash.locked=0"))) memcpy(p + 25, "1", 1);
          +		if ((p = strstr(buf, "androidboot.selinux=permissive"))) memcpy(p + 20, "enforcing ", 10);
          +		if ((p = strstr(buf, "buildvariant=userdebug"))) memcpy(p + 13, "user     ", 9);
          +		if ((p = strstr(buf, "buildvariant=eng "))) memcpy(p + 13, "user", 4);
          +		if ((p = strstr(buf, "androidboot.mode=custom"))) memcpy(p + 17, "normal", 6);
          +		if ((p = strstr(buf, "androidboot.secureboot=0"))) memcpy(p + 23, "1", 1);
          +		if ((p = strstr(buf, "androidboot.lockstate=unlocked"))) memcpy(p + 22, "locked  ", 8);
          +		seq_puts(m, buf);
          +		kfree(buf);
          +		seq_putc(m, '\n');
          +		return 0;
          +	}
          +	seq_puts(m, saved_command_line);
          	seq_putc(m, '\n');
          	return 0;
           }
          EOF
          patch -p1 -N < full_complete_spoof.patch || echo "Spoof patch already applied"

          # =========================================================================
          # 2. APPLY MGLRU PATCH
          # =========================================================================
          echo "=== 2. Applying MGLRU Patch ==="
          MGLRU_PATH="$GITHUB_WORKSPACE/.github/workflows/patches/mglru.patch"
          if [ ! -f "$MGLRU_PATH" ]; then
            MGLRU_PATH="$GITHUB_WORKSPACE/patches/mglru.patch"
          fi

          if [ -f "$MGLRU_PATH" ]; then
            sed -i 's/\r$//' "$MGLRU_PATH"
            git apply --verbose --ignore-whitespace --whitespace=nowarn "$MGLRU_PATH" || patch -p1 -N < "$MGLRU_PATH"
            echo "MGLRU Patch applied successfully!"
          fi

          # =========================================================================
          # 3. APPLY STANDALONE SUSFS + ZEROMOUNT PATCH
          # =========================================================================
          echo "=== 3. Applying Standalone SUSFS & ZeroMount Patch ==="
          SUSFS_PATH="$GITHUB_WORKSPACE/.github/workflows/patches/susfs_zeromount.patch"
          if [ ! -f "$SUSFS_PATH" ]; then
            SUSFS_PATH="$GITHUB_WORKSPACE/patches/susfs_zeromount.patch"
          fi

          if [ -f "$SUSFS_PATH" ]; then
            sed -i 's/\r$//' "$SUSFS_PATH"
            patch -p1 -N --no-backup-if-mismatch < "$SUSFS_PATH" || true
            
            # Ensure SUSFS & ZeroMount entries in Makefile / Kconfig
            grep -q "susfs.o" fs/Makefile || echo 'obj-$(CONFIG_KSU_SUSFS) += susfs.o' >> fs/Makefile
            grep -q "zeromount.o" fs/Makefile || echo 'obj-$(CONFIG_ZEROMOUNT) += zeromount.o' >> fs/Makefile
            grep -q "kernelsu" drivers/Makefile || echo 'obj-$(CONFIG_KSU) += kernelsu/' >> drivers/Makefile
            grep -q "kernelsu" drivers/Kconfig || sed -i '/endmenu/i source "drivers/kernelsu/Kconfig"' drivers/Kconfig
            echo "SUSFS & ZeroMount Patch applied!"
          fi

          # =========================================================================
          # 4. SETUP KERNELSU-NEXT
          # =========================================================================
          echo "=== 4. Setting up KernelSU-Next ==="
          rm -rf KernelSU-Next drivers/kernelsu
          git clone --depth=1 -b dev https://github.com/KernelSU-Next/KernelSU-Next.git KernelSU-Next
          mkdir -p drivers
          ln -sfn ../KernelSU-Next/kernel drivers/kernelsu

          echo "KernelSU-Next, MGLRU, ZeroMount, SUSFS & Full Spoofs applied successfully!"

      - name: Build kernel
        run: |
          chmod +x ./build-kernel.sh
          ./build-kernel.sh ${{ inputs.ccache && '--ccache' || '' }}

      - name: Save ccache cache
        if: ${{ inputs.ccache && always() }}
        uses: actions/cache/save@v4
        with:
          path: work/.ccache
          key: cfx-ccache-${{ env.CLANG_ASSET }}-${{ inputs.kernel_repo }}-${{ inputs.kernel_branch }}

      - name: Publish release
        if: ${{ inputs.publish_release }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$RELEASE_TAG"
          if [ -z "$tag" ]; then
            tag="kernel-$(date -u +%Y%m%d-%H%M)"
          fi
          
          cd "$GITHUB_WORKSPACE/work/dist"
          pkg="$GITHUB_WORKSPACE/work/pkg"
          mkdir -p "$pkg"
          assets=()
          for f in Image Image.lz4 Image.gz vmlinux System.map ikconfig .config; do
            [ -f "$f" ] && assets+=("$f")
          done
          tar -I 'zstd -T0' -cf "$pkg/kernel-dist.tar.zst" .
          assets+=("$pkg/kernel-dist.tar.zst")
          
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" --clobber "${assets[@]}"
          else
            gh release create "$tag" \
              --title "Templar Kernel GKI $tag" \
              --notes "Built with KernelSU-Next, MGLRU, ZeroMount, SUSFS v2.0.0 & Full Spoofs. $(date -u '+%Y-%m-%d %H:%M UTC')" \
              "${assets[@]}"
          fi
          echo "Release $tag completed successfully."
