name: build-kernel

on:
  schedule:
    - cron: "0 22 * * *" # Daily 3:30 AM IST (22:00 UTC)
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish the build as a GitHub release'
        type: boolean
        default: true
      release_tag:
        description: 'Release tag (auto-generated as kernel-YYYYMMDD when empty)'
        required: false
        default: ""
      kernel_repo:
        description: 'Kernel source repository (full URL)'
        required: false
        default: "https://github.com/Chor-A/Templar-Kernel-GKI-5.10"
      kernel_branch:
        description: 'Kernel source branch'
        required: false
        default: "Linux7-Staging"
      kernel_commit:
        description: 'Kernel source commit'
        required: false
        default: ""
      clang_version:
        description: Clang toolchain version
        required: false
        type: choice
        options:
          - clang 19
          - clang 14
        default: "clang 19"
      defconfig_fragment_exclude:
        description: 'Defconfig fragments to exclude'
        required: false
        default: ""
      append_build_env:
        description: 'Extra KEY=VALUE pairs appended to build.config'
        required: false
        default: ""
      append_config:
        description: 'Extra literal CONFIG_* lines injected into the defconfig'
        required: false
        default: "CONFIG_KSU=y,CONFIG_KSU_NEXT=y,CONFIG_OVERLAY_FS=y,CONFIG_KPROBES=y,CONFIG_HAVE_KPROBES=y,CONFIG_KPROBE_EVENTS=y,CONFIG_LRU_GEN=y,CONFIG_LRU_GEN_ENABLED=y,CONFIG_NOMOUNT=y"
      ccache:
        description: 'Accelerate with ccache.'
        type: boolean
        default: true

permissions:
  contents: write
  actions: write

concurrency:
  group: kernel-build-${{ github.event.inputs.release_tag || 'default' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      KERNEL_REPO: ${{ inputs.kernel_repo }}
      KERNEL_BRANCH: ${{ inputs.kernel_branch }}
      KERNEL_COMMIT: ${{ inputs.kernel_commit }}
      CLANG_ASSET: ${{ fromJSON('{"clang 14":"clang-r450784e-linux-x86.tar.zst","clang 19":"clang-r536225-linux-x86.tar.zst"}')[inputs.clang_version] }}
      DEFCONFIG_FRAGMENT_EXCLUDE: ${{ inputs.defconfig_fragment_exclude }}
      APPEND_BUILD_ENV: ${{ inputs.append_build_env }}
      APPEND_CONFIG: ${{ inputs.append_config }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      CCACHE_OPT: ${{ inputs.ccache && '1' || '' }}
      GITHUB_TOKEN: ${{ github.token }}
      KMI_SYMBOL_LIST_STRICT_MODE: "0"
      UPDATE_SYMBOL_LIST: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Free disk space
        run: |
          if [ -f "build/free-disk-space.sh" ]; then
            sudo bash build/free-disk-space.sh
          fi
          df -h

      - name: Configure Git Safe Directory
        run: |
          git config --global --add safe.directory "*"

      - name: Restore ccache cache
        if: ${{ inputs.ccache }}
        uses: actions/cache@v4
        with:
          path: work/.ccache
          key: cfx-ccache-${{ env.CLANG_ASSET }}-${{ inputs.kernel_repo }}-${{ inputs.kernel_branch }}-${{ github.run_id }}
          restore-keys: |
            cfx-ccache-${{ env.CLANG_ASSET }}-${{ inputs.kernel_repo }}-${{ inputs.kernel_branch }}-
            cfx-ccache-${{ env.CLANG_ASSET }}-${{ inputs.kernel_repo }}-
          fail-on-cache-miss: false

      - name: Add 24G swap
        run: |
          sudo swapoff -a || true
          sudo rm -f /swapfile
          sudo fallocate -l 24G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=24576
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: Clone Kernel & Clean Hardcoded NoMount
        run: |
          mkdir -p work
          git clone -b ${{ env.KERNEL_BRANCH }} ${{ env.KERNEL_REPO }} work/common
          cd work/common

          if [ -n "${{ env.KERNEL_COMMIT }}" ]; then
            git checkout ${{ env.KERNEL_COMMIT }}
          fi

          echo "=== Reverting Hardcoded NoMount (Commit 3be84ff) ==="
          git config --global user.email "Antonio_Nelson@proton.me"
          git config --global user.name "Chor-A"
          
          git revert --no-edit 3be84ff || echo "Warning: Commit 3be84ff not found or already reverted. Proceeding."

      - name: Apply SUSFS, Custom Patches, Manual NoMount & KernelSU-Next
        run: |
          cd work/common

          echo "=== 1. Integrating SUSFS into Kernel ==="
          git clone --depth=1 -b gki-android12-5.10 https://gitlab.com/simonpunk/susfs4ksu.git ../susfs4ksu
          cp -r ../susfs4ksu/kernel_patches/fs/* fs/
          cp -r ../susfs4ksu/kernel_patches/include/linux/* include/linux/
          patch -p1 < ../susfs4ksu/kernel_patches/50_add_susfs_in_gki-android12-5.10.patch || echo "Warning: SUSFS patch issue"

          echo "=== 2. Applying Custom Patches (.patch files) ==="
          for dir in "$GITHUB_WORKSPACE/.github/workflows/patches" "$GITHUB_WORKSPACE/patches"; do
            if [ -d "$dir" ]; then
              for patch_file in "$dir"/*.patch; do
                if [ -f "$patch_file" ]; then
                  echo "Applying $patch_file..."
                  sed -i 's/\r$//' "$patch_file"
                  sed -i 's/^$/ /g' "$patch_file"
                  git apply --verbose --ignore-whitespace --whitespace=nowarn "$patch_file" || patch -p1 -N --no-backup-if-mismatch < "$patch_file" || echo "Warning: $patch_file partially skipped or failed"
                fi
              done
            fi
          done
          echo "✅ All custom patches dynamically injected."

          echo "=== 3. Setting up NoMount (Manual Method) ==="
          git clone --depth=1 -b dev https://github.com/maxsteeel/nomount.git ../nomount_repo
          mkdir -p fs/nomount
          cp -f ../nomount_repo/kernel/src/* fs/nomount/
          grep -q 'fs/nomount/Kconfig' fs/Kconfig || echo 'source "fs/nomount/Kconfig"' >> fs/Kconfig
          grep -q 'nomount/' fs/Makefile || echo 'obj-$(CONFIG_NOMOUNT) += nomount/' >> fs/Makefile
          echo "CONFIG_NOMOUNT=y" >> arch/arm64/configs/gki_defconfig

          echo "=== 4. Setting up KernelSU-Next (susfs) via pershoot setup.sh ==="
          curl -LSs "https://raw.githubusercontent.com/pershoot/KernelSU-Next/refs/heads/dev-susfs/kernel/setup.sh" | bash -s dev-susfs

          sed -i 's/CONFIG_KSU=m/CONFIG_KSU=y/g' arch/arm64/configs/gki_defconfig || true
          echo "CONFIG_KSU=y" >> arch/arm64/configs/gki_defconfig
          echo "CONFIG_KSU_NEXT=y" >> arch/arm64/configs/gki_defconfig
          echo "CONFIG_OVERLAY_FS=y" >> arch/arm64/configs/gki_defconfig
          echo "CONFIG_KPROBES=y" >> arch/arm64/configs/gki_defconfig
          echo "CONFIG_HAVE_KPROBES=y" >> arch/arm64/configs/gki_defconfig
          echo "CONFIG_KPROBE_EVENTS=y" >> arch/arm64/configs/gki_defconfig

          echo "CONFIG_KSU_SUSFS=y" >> arch/arm64/configs/gki_defconfig
          echo "CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT=y" >> arch/arm64/configs/gki_defconfig
          echo "CONFIG_KSU_SUSFS_SUS_PATH=y" >> arch/arm64/configs/gki_defconfig
          echo "CONFIG_KSU_SUSFS_SUS_MOUNT=y" >> arch/arm64/configs/gki_defconfig
          echo "CONFIG_KSU_SUSFS_SUS_KSTAT=y" >> arch/arm64/configs/gki_defconfig
          echo "CONFIG_KSU_SUSFS_SUS_OVERLAYFS=y" >> arch/arm64/configs/gki_defconfig
          echo "CONFIG_KSU_SUSFS_TRY_UMOUNT=y" >> arch/arm64/configs/gki_defconfig
          echo "CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y" >> arch/arm64/configs/gki_defconfig
          echo "CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSTAT=y" >> arch/arm64/configs/gki_defconfig
          echo "CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT=y" >> arch/arm64/configs/gki_defconfig
          echo "CONFIG_KSU_SUSFS_SPOOF_UNAME=y" >> arch/arm64/configs/gki_defconfig
          echo "CONFIG_KSU_SUSFS_OPEN_REDIRECT=y" >> arch/arm64/configs/gki_defconfig
          echo "CONFIG_KSU_SUSFS_SUS_SU=y" >> arch/arm64/configs/gki_defconfig
          echo "CONFIG_KSU_SUSFS_ENABLE_LOG=n" >> arch/arm64/configs/gki_defconfig
          echo "✅ Applied successfully!"

      - name: Auto-patch 5.10 Compatibility & Standard audit_fsnotify.c
        run: |
          cd work/common
          echo "=== 1. Auto-patching 5.10 Timer API Bugs ==="
          grep -rl "timer_delete_sync" drivers/ fs/ kernel/ net/ include/ 2>/dev/null | xargs sed -i 's/timer_delete_sync/del_timer_sync/g' 2>/dev/null || true

          echo "=== 2. Ensuring clean standard audit_fsnotify.c ==="
          cat << 'EOF' > kernel/audit_fsnotify.c
          // SPDX-License-Identifier: GPL-2.0-or-later
          /* audit_fsnotify.c -- tracking inodes
           *
           * Copyright 2003-2009,2014-2015 Red Hat, Inc.
           * Copyright 2005 Hewlett-Packard Development Company, L.P.
           * Copyright 2005 IBM Corporation
           */

          #include <linux/kernel.h>
          #include <linux/audit.h>
          #include <linux/kthread.h>
          #include <linux/mutex.h>
          #include <linux/fs.h>
          #include <linux/fsnotify_backend.h>
          #include <linux/namei.h>
          #include <linux/netlink.h>
          #include <linux/sched.h>
          #include <linux/slab.h>
          #include <linux/security.h>
          #include "audit.h"

          /*
           * this mark lives on the parent directory of the inode in question.
           * but dev, ino, and path are about the child
           */
          struct audit_fsnotify_mark {
          	dev_t dev;		/* associated superblock device */
          	unsigned long ino;	/* associated inode number */
          	char *path;		/* insertion path */
          	struct fsnotify_mark mark; /* fsnotify mark on the inode */
          	struct audit_krule *rule;
          };

          /* fsnotify handle. */
          static struct fsnotify_group *audit_fsnotify_group;

          /* fsnotify events we care about. */
          #define AUDIT_FS_EVENTS (FS_MOVE | FS_CREATE | FS_DELETE | FS_DELETE_SELF |\
          			 FS_MOVE_SELF)

          static void audit_fsnotify_mark_free(struct audit_fsnotify_mark *audit_mark)
          {
          	kfree(audit_mark->path);
          	kfree(audit_mark);
          }

          static void audit_fsnotify_free_mark(struct fsnotify_mark *mark)
          {
          	struct audit_fsnotify_mark *audit_mark;

          	audit_mark = container_of(mark, struct audit_fsnotify_mark, mark);
          	audit_fsnotify_mark_free(audit_mark);
          }

          char *audit_mark_path(struct audit_fsnotify_mark *mark)
          {
          	return mark->path;
          }

          int audit_mark_compare(struct audit_fsnotify_mark *mark, u64 ino, dev_t dev)
          {
          	if (mark->ino == AUDIT_INO_UNSET)
          		return 0;
          	return (mark->ino == ino) && (mark->dev == dev);
          }

          static void audit_update_mark(struct audit_fsnotify_mark *audit_mark,
          			     const struct inode *inode)
          {
          	audit_mark->dev = inode ? inode->i_sb->s_dev : AUDIT_DEV_UNSET;
          	audit_mark->ino = inode ? inode->i_ino : AUDIT_INO_UNSET;
          }

          struct audit_fsnotify_mark *audit_alloc_mark(struct audit_krule *krule, char *pathname, int len)
          {
          	struct audit_fsnotify_mark *audit_mark;
          	struct path path;
          	struct dentry *dentry;
          	int ret;

          	if (pathname[0] != '/' || pathname[len-1] == '/')
          		return ERR_PTR(-EINVAL);

          	dentry = kern_path_parent(pathname, &path);
          	if (IS_ERR(dentry))
          		return ERR_CAST(dentry); /* returning an error */

          	audit_mark = kzalloc(sizeof(*audit_mark), GFP_KERNEL);
          	if (unlikely(!audit_mark)) {
          		audit_mark = ERR_PTR(-ENOMEM);
          		goto out;
          	}

          	fsnotify_init_mark(&audit_mark->mark, audit_fsnotify_group);
          	audit_mark->mark.mask = AUDIT_FS_EVENTS;
          	audit_mark->path = pathname;
          	audit_update_mark(audit_mark, dentry->d_inode);
          	audit_mark->rule = krule;

          	ret = fsnotify_add_inode_mark(&audit_mark->mark, path.dentry->d_inode, 0);
          	if (ret < 0) {
          		audit_mark->path = NULL;
          		fsnotify_put_mark(&audit_mark->mark);
          		audit_mark = ERR_PTR(ret);
          	}

          out:
          	dput(dentry);
          	path_put(&path);
          	return audit_mark;
          }

          static void audit_mark_log_rule_change(struct audit_fsnotify_mark *audit_mark, char *op)
          {
          	struct audit_buffer *ab;
          	struct audit_krule *rule = audit_mark->rule;

          	if (!audit_enabled)
          		return;
          	ab = audit_log_start(audit_context(), GFP_NOFS, AUDIT_CONFIG_CHANGE);
          	if (unlikely(!ab))
          		return;
          	audit_log_session_info(ab);
          	audit_log_format(ab, " op=%s path=", op);
          	audit_log_untrustedstring(ab, audit_mark->path);
          	audit_log_key(ab, rule->filterkey);
          	audit_log_format(ab, " list=%d res=1", rule->listnr);
          	audit_log_end(ab);
          }

          void audit_remove_mark(struct audit_fsnotify_mark *audit_mark)
          {
          	fsnotify_destroy_mark(&audit_mark->mark, audit_fsnotify_group);
          	fsnotify_put_mark(&audit_mark->mark);
          }

          void audit_remove_mark_rule(struct audit_krule *krule)
          {
          	struct audit_fsnotify_mark *mark = krule->exe;

          	if (mark) {
          		audit_remove_mark(mark);
          		krule->exe = NULL;
          	}
          }

          static void audit_autoremove_mark_rule(struct audit_fsnotify_mark *audit_mark)
          {
          	struct audit_krule *rule = audit_mark->rule;
          	struct audit_entry *entry = container_of(rule, struct audit_entry, rule);

          	audit_mark_log_rule_change(audit_mark, "autoremove_rule");
          	audit_del_rule(entry);
          }

          /* Update mark data in audit rules based on fsnotify events. */
          static int audit_mark_handle_event(struct fsnotify_mark *inode_mark, u32 mask,
          				   struct inode *inode, struct inode *dir,
          				   const struct qstr *dname, u32 cookie)
          {
          	struct audit_fsnotify_mark *audit_mark;

          	audit_mark = container_of(inode_mark, struct audit_fsnotify_mark, mark);

          	if (WARN_ON_ONCE(inode_mark->group != audit_fsnotify_group) ||
          	    WARN_ON_ONCE(!inode))
          		return 0;

          	if (mask & (FS_CREATE|FS_MOVED_TO|FS_DELETE|FS_MOVED_FROM)) {
          		if (audit_compare_dname_path(dname, audit_mark->path, AUDIT_NAME_FULL))
          			return 0;
          		audit_update_mark(audit_mark, inode);
          	} else if (mask & (FS_DELETE_SELF|FS_UNMOUNT|FS_MOVE_SELF)) {
          		audit_autoremove_mark_rule(audit_mark);
          	}

          	return 0;
          }

          static const struct fsnotify_ops audit_mark_fsnotify_ops = {
          	.handle_inode_event = audit_mark_handle_event,
          	.free_mark = audit_fsnotify_free_mark,
          };

          static int __init audit_fsnotify_init(void)
          {
          	audit_fsnotify_group = fsnotify_alloc_group(&audit_mark_fsnotify_ops);
          	if (IS_ERR(audit_fsnotify_group)) {
          		audit_fsnotify_group = NULL;
          		audit_panic("cannot create audit fsnotify group");
          	}
          	return 0;
          }
          device_initcall(audit_fsnotify_init);
          EOF
          echo "✅ All upstream API bugs automatically healed!"

      - name: Build kernel
        run: |
          chmod +x ./build-kernel.sh
          ./build-kernel.sh ${{ inputs.ccache && '--ccache' || '' }}

      - name: Save ccache cache
        if: ${{ inputs.ccache && always() }}
        uses: actions/cache/save@v4
        with:
          path: work/.ccache
          key: cfx-ccache-${{ env.CLANG_ASSET }}-${{ inputs.kernel_repo }}-${{ inputs.kernel_branch }}-${{ github.run_id }}

      - name: Publish release
        if: ${{ inputs.publish_release }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$RELEASE_TAG"
          if [ -z "$tag" ]; then
            tag="kernel-$(date -u +%Y%m%d-%H%M)"
          fi
          
          cd "$GITHUB_WORKSPACE/work/dist"
          pkg="$GITHUB_WORKSPACE/work/pkg"
          mkdir -p "$pkg"
          assets=()
          for f in Image Image.lz4 Image.gz vmlinux System.map ikconfig .config; do
            [ -f "$f" ] && assets+=("$f")
          done
          tar -I 'zstd -T0' -cf "$pkg/kernel-dist.tar.zst" .
          assets+=("$pkg/kernel-dist.tar.zst")
          
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" --clobber "${assets[@]}"
          else
            gh release create "$tag" \
              --title "Templar Kernel GKI $tag" \
              --notes "Built with pershoot KernelSU-Next (susfs), MGLRU, NoMount & Full Spoofs. $(date -u '+%Y-%m-%d %H:%M UTC')" \
              "${assets[@]}"
          fi
