name: build-kernel
"on":
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish the build as a GitHub release'
        type: boolean
        default: true
      release_tag:
        description: 'Release tag (auto-generated as kernel-YYYYMMDD when empty)'
        required: false
        default: ""
      kernel_repo:
        description: 'Kernel source repository (full URL)'
        required: false
        default: "https://github.com/Steambot12/Templar-Kernel-GKI-5.10"
      kernel_branch:
        description: 'Kernel source branch'
        required: false
        default: "Linux7-Staging"
      kernel_commit:
        description: 'Kernel source commit'
        required: false
        default: ""
      clang_version:
        description: Clang toolchain version
        required: false
        type: choice
        options:
          - clang 19
          - clang 14
        default: "clang 19"
      defconfig_fragment_exclude:
        description: 'Defconfig fragments to exclude (space- or comma-separated names)'
        required: false
        default: ""
      append_build_env:
        description: 'Extra KEY=VALUE pairs appended to build.config (comma-separated)'
        required: false
        default: ""
      append_config:
        description: 'Extra literal CONFIG_* lines injected into the defconfig'
        required: false
        default: "CONFIG_KSU=y,CONFIG_KSU_NEXT=y,CONFIG_KSU_SUSFS=y,CONFIG_KSU_SUSFS_SUS_PATH=y,CONFIG_KSU_SUSFS_SUS_MOUNT=y,CONFIG_KSU_SUSFS_SUS_KSTAT=y,CONFIG_KSU_SUSFS_SUS_KSTAT_REDIRECT=y,CONFIG_KSU_SUSFS_SUS_MAP=y,CONFIG_KSU_SUSFS_OPEN_REDIRECT=y,CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y,CONFIG_KSU_SUSFS_SPOOF_UNAME=y,CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y,CONFIG_KSU_SUSFS_ENABLE_LOG=y,CONFIG_KSU_SUSFS_UNICODE_FILTER=y,CONFIG_KSU_SUSFS_HIDDEN_NAME=y,CONFIG_KSU_SUSFS_HARDENED=y,CONFIG_ZEROMOUNT=y,CONFIG_LRU_GEN=y,CONFIG_LRU_GEN_ENABLED=y"
      ccache:
        description: 'Accelerate with ccache.'
        type: boolean
        default: true

permissions:
  contents: write
  actions: write

concurrency:
  group: kernel-build-${{ github.event.inputs.release_tag || 'default' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      KERNEL_REPO: ${{ inputs.kernel_repo }}
      KERNEL_BRANCH: ${{ inputs.kernel_branch }}
      KERNEL_COMMIT: ${{ inputs.kernel_commit }}
      CLANG_ASSET: ${{ fromJSON('{"clang 14":"clang-r450784e-linux-x86.tar.zst","clang 19":"clang-r536225-linux-x86.tar.zst"}')[inputs.clang_version] }}
      DEFCONFIG_FRAGMENT_EXCLUDE: ${{ inputs.defconfig_fragment_exclude }}
      APPEND_BUILD_ENV: ${{ inputs.append_build_env }}
      APPEND_CONFIG: ${{ inputs.append_config }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      CCACHE_OPT: ${{ inputs.ccache && '1' || '' }}
      GITHUB_TOKEN: ${{ github.token }}
      KMI_SYMBOL_LIST_STRICT_MODE: "0"
      UPDATE_SYMBOL_LIST: "1"

    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          if [ -f "build/free-disk-space.sh" ]; then
            sudo bash build/free-disk-space.sh
          fi
          df -h

      - name: Configure Git Safe Directory
        run: |
          git config --global --add safe.directory "*"

      - name: Restore ccache cache
        if: ${{ inputs.ccache }}
        uses: actions/cache@v4
        with:
          path: work/.ccache
          key: cfx-ccache-${{ env.CLANG_ASSET }}-${{ inputs.kernel_repo }}-${{ inputs.kernel_branch }}
          restore-keys: |
            cfx-ccache-${{ env.CLANG_ASSET }}-${{ inputs.kernel_repo }}-
            cfx-ccache-${{ env.CLANG_ASSET }}-
          fail-on-cache-miss: false

      - name: Add 24G swap
        run: |
          sudo swapoff -a || true
          sudo rm -f /swapfile
          sudo fallocate -l 24G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=24576
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: Clone Kernel & Apply All Patches
        run: |
          mkdir -p work
          git clone --depth=1 -b ${{ env.KERNEL_BRANCH }} ${{ env.KERNEL_REPO }} work/common
          cd work/common

          # 1. Clone KernelSU-Next to root (Matches patch symlink: drivers/kernelsu -> ../KernelSU-Next/kernel)
          echo "=== Cloning KernelSU-Next ==="
          git clone --depth=1 -b dev https://github.com/KernelSU-Next/KernelSU-Next.git KernelSU-Next

          # 2. Apply SUSFS + ZeroMount + KSU Patch
          echo "=== Applying Standalone SUSFS & ZeroMount Patch ==="
          if [ -f "$GITHUB_WORKSPACE/patches/susfs_zeromount.patch" ]; then
            patch -p1 -N < "$GITHUB_WORKSPACE/patches/susfs_zeromount.patch" || echo "SUSFS patch applied with warnings"
          elif [ -f "$GITHUB_WORKSPACE/.github/workflows/patches/susfs_zeromount.patch" ]; then
            patch -p1 -N < "$GITHUB_WORKSPACE/.github/workflows/patches/susfs_zeromount.patch" || echo "SUSFS patch applied with warnings"
          fi

          # Ensure symlink from patch exists
          mkdir -p drivers
          ln -sfn ../KernelSU-Next/kernel drivers/kernelsu

          # 3. Apply MGLRU Patch if present
          if [ -f "$GITHUB_WORKSPACE/patches/mglru.patch" ]; then
            echo "=== Applying MGLRU Patch ==="
            patch -p1 -N < "$GITHUB_WORKSPACE/patches/mglru.patch" || echo "MGLRU patch applied with warnings"
          fi

          echo "Kernel patched successfully with SUSFS v2.0, ZeroMount, and KernelSU-Next!"

      - name: Build kernel
        run: |
          chmod +x ./build-kernel.sh
          ./build-kernel.sh ${{ inputs.ccache && '--ccache' || '' }}

      - name: Save ccache cache
        if: ${{ inputs.ccache && always() }}
        uses: actions/cache/save@v4
        with:
          path: work/.ccache
          key: cfx-ccache-${{ env.CLANG_ASSET }}-${{ inputs.kernel_repo }}-${{ inputs.kernel_branch }}

      - name: Publish release
        if: ${{ inputs.publish_release }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$RELEASE_TAG"
          if [ -z "$tag" ]; then
            tag="kernel-$(date -u +%Y%m%d-%H%M)"
          fi
          
          cd "$GITHUB_WORKSPACE/work/dist"
          pkg="$GITHUB_WORKSPACE/work/pkg"
          mkdir -p "$pkg"
          assets=()
          for f in Image Image.lz4 Image.gz vmlinux System.map ikconfig .config; do
            [ -f "$f" ] && assets+=("$f")
          done
          tar -I 'zstd -T0' -cf "$pkg/kernel-dist.tar.zst" .
          assets+=("$pkg/kernel-dist.tar.zst")
          
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" --clobber "${assets[@]}"
          else
            gh release create "$tag" \
              --title "Templar Kernel GKI $tag (SUSFS + ZeroMount)" \
              --notes "Built with KernelSU-Next, SUSFS v2.0.0, ZeroMount & MGLRU. $(date -u '+%Y-%m-%d %H:%M UTC')" \
              "${assets[@]}"
          fi
          echo "Release $tag completed successfully."
