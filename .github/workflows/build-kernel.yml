          patch -p1 -N --no-backup-if-mismatch < full_complete_spoof.patch || echo "Spoof patch already applied"

          # 2. SETUP NOMOUNT
          echo "=== 2. Setting up NoMount (Manual Method) ==="
          git clone --depth=1 -b dev https://github.com/maxsteeel/nomount.git ../nomount_repo
          
          mkdir -p fs/nomount
          cp -f ../nomount_repo/kernel/src/* fs/nomount/
          
          grep -q 'fs/nomount/Kconfig' fs/Kconfig || echo 'source "fs/nomount/Kconfig"' >> fs/Kconfig
          grep -q 'nomount/' fs/Makefile || echo 'obj-$(CONFIG_NOMOUNT) += nomount/' >> fs/Makefile
          echo "CONFIG_NOMOUNT=y" >> arch/arm64/configs/gki_defconfig

          # 3. APPLY MGLRU PATCH
          echo "=== 3. Applying MGLRU Patch ==="
          MGLRU_PATH="$GITHUB_WORKSPACE/.github/workflows/patches/mglru.patch"
          if [ ! -f "$MGLRU_PATH" ]; then
            MGLRU_PATH="$GITHUB_WORKSPACE/patches/mglru.patch"
          fi

          if [ -f "$MGLRU_PATH" ]; then
            sed -i 's/\r$//' "$MGLRU_PATH"
            git apply --verbose --ignore-whitespace --whitespace=nowarn "$MGLRU_PATH" || patch -p1 -N < "$MGLRU_PATH"
            echo "MGLRU Patch applied successfully!"
          fi

          # 4. SETUP KERNELSU-NEXT
          echo "=== 4. Setting up KernelSU-Next via official setup.sh ==="
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s next

          # Force-enable required configs
          sed -i 's/CONFIG_KSU=m/CONFIG_KSU=y/g' arch/arm64/configs/gki_defconfig || true
          echo "CONFIG_KSU=y" >> arch/arm64/configs/gki_defconfig
          echo "CONFIG_KSU_NEXT=y" >> arch/arm64/configs/gki_defconfig
          echo "CONFIG_OVERLAY_FS=y" >> arch/arm64/configs/gki_defconfig
          echo "CONFIG_KPROBES=y" >> arch/arm64/configs/gki_defconfig
          echo "CONFIG_HAVE_KPROBES=y" >> arch/arm64/configs/gki_defconfig
          echo "CONFIG_KPROBE_EVENTS=y" >> arch/arm64/configs/gki_defconfig

          echo "✅ All Patches Applied Successfully!"

      - name: Build kernel
        run: |
          chmod +x ./build-kernel.sh
          ./build-kernel.sh ${{ inputs.ccache && '--ccache' || '' }}

      - name: Save ccache cache
        if: ${{ inputs.ccache && always() }}
        uses: actions/cache/save@v4
        with:
          path: work/.ccache
          key: cfx-ccache-${{ env.CLANG_ASSET }}-${{ inputs.kernel_repo }}-${{ inputs.kernel_branch }}-${{ github.run_id }}

      - name: Publish release
        if: ${{ inputs.publish_release }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$RELEASE_TAG"
          if [ -z "$tag" ]; then
            tag="kernel-$(date -u +%Y%m%d-%H%M)"
          fi
