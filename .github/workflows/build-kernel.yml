name: build-kernel

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish the build as a GitHub release'
        type: boolean
        default: true
      release_tag:
        description: 'Release tag (auto-generated as kernel-YYYYMMDD when empty)'
        required: false
        default: ""
      kernel_repo:
        description: 'Kernel source repository (full URL)'
        required: false
        default: "https://github.com/Steambot12/Templar-Kernel-GKI-5.10"
      kernel_branch:
        description: 'Kernel source branch'
        required: false
        default: "Linux7-Staging"
      kernel_commit:
        description: 'Kernel source commit'
        required: false
        default: ""
      clang_version:
        description: Clang toolchain version
        required: false
        type: choice
        options:
          - clang 19
          - clang 14
        default: "clang 19"
      defconfig_fragment_exclude:
        description: 'Defconfig fragments to exclude (space- or comma-separated names)'
        required: false
        default: ""
      append_build_env:
        description: 'Extra KEY=VALUE pairs appended to build.config (comma-separated)'
        required: false
        default: ""
      append_config:
        description: 'Extra literal CONFIG_* lines injected into the defconfig'
        required: false
        default: "CONFIG_KSU=y,CONFIG_KSU_NEXT=y,CONFIG_OVERLAY_FS=y,CONFIG_KPROBES=y,CONFIG_HAVE_KPROBES=y,CONFIG_KPROBE_EVENTS=y,CONFIG_LRU_GEN=y,CONFIG_LRU_GEN_ENABLED=y,CONFIG_NOMOUNT=y"
      ccache:
        description: 'Accelerate with ccache.'
        type: boolean
        default: true

permissions:
  contents: write
  actions: write

concurrency:
  group: kernel-build-${{ github.event.inputs.release_tag || 'default' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      KERNEL_REPO: ${{ inputs.kernel_repo }}
      KERNEL_BRANCH: ${{ inputs.kernel_branch }}
      KERNEL_COMMIT: ${{ inputs.kernel_commit }}
      CLANG_ASSET: ${{ fromJSON('{"clang 14":"clang-r450784e-linux-x86.tar.zst","clang 19":"clang-r536225-linux-x86.tar.zst"}')[inputs.clang_version] }}
      DEFCONFIG_FRAGMENT_EXCLUDE: ${{ inputs.defconfig_fragment_exclude }}
      APPEND_BUILD_ENV: ${{ inputs.append_build_env }}
      APPEND_CONFIG: ${{ inputs.append_config }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      CCACHE_OPT: ${{ inputs.ccache && '1' || '' }}
      GITHUB_TOKEN: ${{ github.token }}
      KMI_SYMBOL_LIST_STRICT_MODE: "0"
      UPDATE_SYMBOL_LIST: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Free disk space
        run: |
          if [ -f "build/free-disk-space.sh" ]; then
            sudo bash build/free-disk-space.sh
          fi
          df -h

      - name: Configure Git Safe Directory
        run: |
          git config --global --add safe.directory "*"

      - name: Restore ccache cache
        if: ${{ inputs.ccache }}
        uses: actions/cache@v4
        with:
          path: work/.ccache
          key: cfx-ccache-${{ env.CLANG_ASSET }}-${{ inputs.kernel_repo }}-${{ inputs.kernel_branch }}-${{ github.run_id }}
          restore-keys: |
            cfx-ccache-${{ env.CLANG_ASSET }}-${{ inputs.kernel_repo }}-${{ inputs.kernel_branch }}-
            cfx-ccache-${{ env.CLANG_ASSET }}-${{ inputs.kernel_repo }}-
          fail-on-cache-miss: false

      - name: Add 24G swap
        run: |
          sudo swapoff -a || true
          sudo rm -f /swapfile
          sudo fallocate -l 24G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=24576
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: Clone Kernel & Clean Hardcoded NoMount
        run: |
          mkdir -p work
          git clone -b ${{ env.KERNEL_BRANCH }} ${{ env.KERNEL_REPO }} work/common
          cd work/common

          if [ -n "${{ env.KERNEL_COMMIT }}" ]; then
            git checkout ${{ env.KERNEL_COMMIT }}
          fi

          echo "=== Reverting Hardcoded NoMount (Commit 3be84ff) ==="
          git config --global user.email "github-actions@github.com"
          git config --global user.name "GitHub Actions"
          
          git revert --no-edit 3be84ff || echo "Warning: Commit 3be84ff not found or already reverted. Proceeding."

      - name: Apply Spoofs, Manual NoMount, MGLRU & Official KernelSU-Next Setup
        run: |
          cd work/common

          # =========================================================================
          # 1. APPLY FULL COMPLETE SPOOF (VIA PERL INJECTION)
          # =========================================================================
          echo "=== 1. Applying Full Complete Spoof Patch ==="
          
          # Spoof array.c (Hide root PID)
          perl -0777 -pi -e 's/(rcu_read_unlock\(\);\n\n\s*if \(umask >= 0\))/\n\tif (current_uid().val >= 10000)\n\t\ttpid = 0;\n$1/s' fs/proc/array.c
          
          # Spoof cmdline.c
          perl -0777 -pi -e 's/(static int cmdline_proc_show.*?)\{\n\s*seq_puts\(m, saved_command_line\);/$1{\n\tchar *p;\n\tchar *buf = kstrdup(saved_command_line, GFP_KERNEL);\n\tif (buf) {\n\t\tif ((p = strstr(buf, "androidboot.verifiedbootstate=orange"))) memcpy(p + 30, "green ", 6);\n\t\tif ((p = strstr(buf, "androidboot.verifiedbootstate=yellow"))) memcpy(p + 30, "green ", 6);\n\t\tif ((p = strstr(buf, "androidboot.vbmeta.device_state=unlocked"))) memcpy(p + 32, "locked  ", 8);\n\t\tif ((p = strstr(buf, "androidboot.flash.locked=0"))) memcpy(p + 25, "1", 1);\n\t\tif ((p = strstr(buf, "androidboot.selinux=permissive"))) memcpy(p + 20, "enforcing ", 10);\n\t\tif ((p = strstr(buf, "buildvariant=userdebug"))) memcpy(p + 13, "user     ", 9);\n\t\tif ((p = strstr(buf, "buildvariant=eng "))) memcpy(p + 13, "user", 4);\n\t\tif ((p = strstr(buf, "androidboot.mode=custom"))) memcpy(p + 17, "normal", 6);\n\t\tif ((p = strstr(buf, "androidboot.secureboot=0"))) memcpy(p + 23, "1", 1);\n\t\tif ((p = strstr(buf, "androidboot.lockstate=unlocked"))) memcpy(p + 22, "locked  ", 8);\n\t\tseq_puts(m, buf);\n\t\tkfree(buf);\n\t\tseq_putc(m, '\''\\n'\'');\n\t\treturn 0;\n\t}\n\tseq_puts(m, saved_command_line);/s' fs/proc/cmdline.c
          perl -pi -e 's/#include <linux\/seq_file\.h>/#include <linux\/seq_file.h>\n#include <linux\/slab.h>\n#include <linux\/string.h>/g' fs/proc/cmdline.c

          # Spoof bootconfig.c
          perl -0777 -pi -e 's/(static int boot_config_proc_show.*?)\{\n\s*if \(saved_boot_config\)/$1{\n\tchar *p;\n\tchar *buf = kstrdup(saved_boot_config, GFP_KERNEL);\n\tif (buf) {\n\t\tif ((p = strstr(buf, "androidboot.verifiedbootstate=orange"))) memcpy(p + 30, "green ", 6);\n\t\tif ((p = strstr(buf, "androidboot.verifiedbootstate=yellow"))) memcpy(p + 30, "green ", 6);\n\t\tif ((p = strstr(buf, "androidboot.vbmeta.device_state=unlocked"))) memcpy(p + 32, "locked  ", 8);\n\t\tif ((p = strstr(buf, "androidboot.flash.locked=0"))) memcpy(p + 25, "1", 1);\n\t\tif ((p = strstr(buf, "androidboot.selinux=permissive"))) memcpy(p + 20, "enforcing ", 10);\n\t\tif ((p = strstr(buf, "buildvariant=userdebug"))) memcpy(p + 13, "user     ", 9);\n\t\tif ((p = strstr(buf, "buildvariant=eng "))) memcpy(p + 13, "user", 4);\n\t\tif ((p = strstr(buf, "androidboot.mode=custom"))) memcpy(p + 17, "normal", 6);\n\t\tif ((p = strstr(buf, "androidboot.secureboot=0"))) memcpy(p + 23, "1", 1);\n\t\tif ((p = strstr(buf, "androidboot.lockstate=unlocked"))) memcpy(p + 22, "locked  ", 8);\n\t\tif ((p = strstr(buf, "\\"orange\\""))) memcpy(p + 1, "green\\" ", 7);\n\t\tif ((p = strstr(buf, "\\"yellow\\""))) memcpy(p + 1, "green\\" ", 7);\n\t\tif ((p = strstr(buf, "\\"unlocked\\""))) memcpy(p + 1, "locked\\"  ", 9);\n\t\tseq_puts(m, buf);\n\t\tkfree(buf);\n\t\treturn 0;\n\t}\n\tif (saved_boot_config)/s' fs/proc/bootconfig.c
          perl -pi -e 's/#include <linux\/bootconfig\.h>/#include <linux\/bootconfig.h>\n#include <linux\/string.h>\n#include <linux\/slab.h>/g' fs/proc/bootconfig.c
          
          echo "✅ Spoofs dynamically injected."

          # =========================================================================
          # 2. SETUP NOMOUNT (MANUAL INTEGRATION - DEV BRANCH)
          # =========================================================================
          echo "=== 2. Setting up NoMount (Manual Method) ==="
          git clone --depth=1 -b dev https://github.com/maxsteeel/nomount.git ../nomount_repo
          
          mkdir -p fs/nomount
          cp -f ../nomount_repo/kernel/src/* fs/nomount/
          
          grep -q 'fs/nomount/Kconfig' fs/Kconfig || echo 'source "fs/nomount/Kconfig"' >> fs/Kconfig
          grep -q 'nomount/' fs/Makefile || echo 'obj-$(CONFIG_NOMOUNT) += nomount/' >> fs/Makefile
          echo "CONFIG_NOMOUNT=y" >> arch/arm64/configs/gki_defconfig

          # =========================================================================
          # 3. APPLY MGLRU PATCH
          # =========================================================================
          echo "=== 3. Applying MGLRU Patch ==="
          MGLRU_PATH="$GITHUB_WORKSPACE/.github/workflows/patches/mglru.patch"
          if [ ! -f "$MGLRU_PATH" ]; then
            MGLRU_PATH="$GITHUB_WORKSPACE/patches/mglru.patch"
          fi

          if [ -f "$MGLRU_PATH" ]; then
            sed -i 's/\r$//' "$MGLRU_PATH"
            git apply --verbose --ignore-whitespace --whitespace=nowarn "$MGLRU_PATH" || patch -p1 -N < "$MGLRU_PATH"
            echo "MGLRU Patch applied successfully!"
          fi

          # =========================================================================
          # 4. SETUP KERNELSU-NEXT VIA OFFICIAL SETUP SCRIPT
          # =========================================================================
          echo "=== 4. Setting up KernelSU-Next via official setup.sh ==="
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s next

          # Force-enable required KSU configurations
          sed -i 's/CONFIG_KSU=m/CONFIG_KSU=y/g' arch/arm64/configs/gki_defconfig || true
          echo "CONFIG_KSU=y" >> arch/arm64/configs/gki_defconfig
          echo "CONFIG_KSU_NEXT=y" >> arch/arm64/configs/gki_defconfig
          echo "CONFIG_OVERLAY_FS=y" >> arch/arm64/configs/gki_defconfig
          echo "CONFIG_KPROBES=y" >> arch/arm64/configs/gki_defconfig
          echo "CONFIG_HAVE_KPROBES=y" >> arch/arm64/configs/gki_defconfig
          echo "CONFIG_KPROBE_EVENTS=y" >> arch/arm64/configs/gki_defconfig

          echo "✅ Manual NoMount, Official KernelSU-Next, MGLRU & Spoofs applied successfully!"

      - name: Build kernel
        run: |
          chmod +x ./build-kernel.sh
          ./build-kernel.sh ${{ inputs.ccache && '--ccache' || '' }}

      - name: Save ccache cache
        if: ${{ inputs.ccache && always() }}
        uses: actions/cache/save@v4
        with:
          path: work/.ccache
          key: cfx-ccache-${{ env.CLANG_ASSET }}-${{ inputs.kernel_repo }}-${{ inputs.kernel_branch }}-${{ github.run_id }}

      - name: Publish release
        if: ${{ inputs.publish_release }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$RELEASE_TAG"
          if [ -z "$tag" ]; then
            tag="kernel-$(date -u +%Y%m%d-%H%M)"
          fi
          
          cd "$GITHUB_WORKSPACE/work/dist"
          pkg="$GITHUB_WORKSPACE/work/pkg"
          mkdir -p "$pkg"
          assets=()
          for f in Image Image.lz4 Image.gz vmlinux System.map ikconfig .config; do
            [ -f "$f" ] && assets+=("$f")
          done
          tar -I 'zstd -T0' -cf "$pkg/kernel-dist.tar.zst" .
          assets+=("$pkg/kernel-dist.tar.zst")
          
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" --clobber "${assets[@]}"
          else
            gh release create "$tag" \
              --title "Templar Kernel GKI $tag" \
              --notes "Built with Official KernelSU-Next Setup, MGLRU, NoMount & Full Spoofs. $(date -u '+%Y-%m-%d %H:%M UTC')" \
              "${assets[@]}"
          fi
          echo "Release $tag completed successfully."
