name: build-kernel
"on":
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish the build as a GitHub release'
        type: boolean
        default: true
      release_tag:
        description: 'Release tag (auto-generated as kernel-YYYYMMDD when empty)'
        required: false
        default: ""
      kernel_repo:
        description: 'Kernel source repository (full URL)'
        required: false
        default: "https://github.com/Steambot12/Templar-Kernel-GKI-5.10"
      kernel_branch:
        description: 'Kernel source branch'
        required: false
        default: "Linux7-Staging"
      kernel_commit:
        description: 'Kernel source commit'
        required: false
        default: ""
      clang_version:
        description: Clang toolchain version
        required: false
        type: choice
        options:
          - clang 19
          - clang 14
        default: "clang 19"
      defconfig_fragment_exclude:
        description: 'Defconfig fragments to exclude (space- or comma-separated names)'
        required: false
        default: ""
      append_build_env:
        description: 'Extra KEY=VALUE pairs appended to build.config (comma-separated)'
        required: false
        default: ""
      append_config:
        description: 'Extra literal CONFIG_* lines injected into the defconfig'
        required: false
        default: "CONFIG_KSU=y,CONFIG_KSU_NEXT=y,CONFIG_NOMOUNT=y,CONFIG_KSU_SUSFS=y,CONFIG_KSU_SUSFS_SUS_PATH=y,CONFIG_KSU_SUSFS_SUS_MOUNT=y,CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=y,CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y,CONFIG_KSU_SUSFS_SUS_KSTAT=y,CONFIG_KSU_SUSFS_SUS_OVERLAYFS=y,CONFIG_KSU_SUSFS_TRY_UMOUNT=y,CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT=y,CONFIG_KSU_SUSFS_SPOOF_UNAME=y,CONFIG_KSU_SUSFS_ENABLE_LOG=y,CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y,CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y,CONFIG_KSU_SUSFS_OPEN_REDIRECT=y,CONFIG_KSU_SUSFS_SUS_MAP=y,CONFIG_LRU_GEN=y,CONFIG_LRU_GEN_ENABLED=y"
      ccache:
        description: 'Accelerate with ccache.'
        type: boolean
        default: true

permissions:
  contents: write
  actions: write

concurrency:
  group: kernel-build-${{ github.event.inputs.release_tag || 'default' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      KERNEL_REPO: ${{ inputs.kernel_repo }}
      KERNEL_BRANCH: ${{ inputs.kernel_branch }}
      KERNEL_COMMIT: ${{ inputs.kernel_commit }}
      CLANG_ASSET: ${{ fromJSON('{"clang 14":"clang-r450784e-linux-x86.tar.zst","clang 19":"clang-r536225-linux-x86.tar.zst"}')[inputs.clang_version] }}
      DEFCONFIG_FRAGMENT_EXCLUDE: ${{ inputs.defconfig_fragment_exclude }}
      APPEND_BUILD_ENV: ${{ inputs.append_build_env }}
      APPEND_CONFIG: ${{ inputs.append_config }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      CCACHE_OPT: ${{ inputs.ccache && '1' || '' }}
      GITHUB_TOKEN: ${{ github.token }}
      KMI_SYMBOL_LIST_STRICT_MODE: "0"
      UPDATE_SYMBOL_LIST: "1"

    steps:
      - uses: actions/checkout@v5

      - name: Free disk space
        run: |
          sudo bash build/free-disk-space.sh
          df -h

      - name: Restore ccache cache
        if: ${{ inputs.ccache }}
        uses: actions/cache@v4
        with:
          path: work/.ccache
          key: cfx-ccache-${{ env.CLANG_ASSET }}-${{ inputs.kernel_repo }}-${{ inputs.kernel_branch }}
          restore-keys: |
            cfx-ccache-${{ env.CLANG_ASSET }}-${{ inputs.kernel_repo }}-
            cfx-ccache-${{ env.CLANG_ASSET }}-
          fail-on-cache-miss: false

      - name: Add 24G swap
        run: |
          sudo swapoff -a
          sudo rm -f /swapfile
          sudo fallocate -l 24G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=24576
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: Clone Kernel & Apply All Patches
        run: |
          mkdir -p work
          git clone --depth=1 -b ${{ env.KERNEL_BRANCH }} ${{ env.KERNEL_REPO }} work/common
          cd work/common

          # 1. Apply Full Complete Spoof Patch
          cat << 'EOF' > full_complete_spoof.patch
          diff --git a/fs/proc/array.c b/fs/proc/array.c
          index f5da74234..8a91e931f 100644
          --- a/fs/proc/array.c
          +++ b/fs/proc/array.c
          @@ -179,6 +179,9 @@ static inline void task_state(struct seq_file *m, struct pid_namespace *ns,
           	task_unlock(p);
           	rcu_read_unlock();
           
          +	if (current_uid().val >= 10000)
          +		tpid = 0;
          +
           	if (umask >= 0)
           		seq_printf(m, "Umask:\t%#04o\n", umask);
           	seq_puts(m, "State:\t");
          diff --git a/fs/proc/cmdline.c b/fs/proc/cmdline.c
          index fa762c5fb..9108c4a03 100644
          --- a/fs/proc/cmdline.c
          +++ b/fs/proc/cmdline.c
          @@ -2,6 +2,8 @@
           #include <linux/fs.h>
           #include <linux/init.h>
           #include <linux/proc_fs.h>
           #include <linux/seq_file.h>
          +#include <linux/slab.h>
          +#include <linux/string.h>
           
           static int cmdline_proc_show(struct seq_file *m, void *v)
           {
          +	char *p;
          +	char *buf = kstrdup(saved_command_line, GFP_KERNEL);
          +	if (buf) {
          +		if ((p = strstr(buf, "androidboot.verifiedbootstate=orange"))) memcpy(p + 30, "green ", 6);
          +		if ((p = strstr(buf, "androidboot.verifiedbootstate=yellow"))) memcpy(p + 30, "green ", 6);
          +		if ((p = strstr(buf, "androidboot.vbmeta.device_state=unlocked"))) memcpy(p + 32, "locked  ", 8);
          +		if ((p = strstr(buf, "androidboot.flash.locked=0"))) memcpy(p + 25, "1", 1);
          +		if ((p = strstr(buf, "androidboot.selinux=permissive"))) memcpy(p + 20, "enforcing ", 10);
          +		if ((p = strstr(buf, "buildvariant=userdebug"))) memcpy(p + 13, "user     ", 9);
          +		if ((p = strstr(buf, "buildvariant=eng "))) memcpy(p + 13, "user", 4);
          +		if ((p = strstr(buf, "androidboot.mode=custom"))) memcpy(p + 17, "normal", 6);
          +		if ((p = strstr(buf, "androidboot.secureboot=0"))) memcpy(p + 23, "1", 1);
          +		if ((p = strstr(buf, "androidboot.lockstate=unlocked"))) memcpy(p + 22, "locked  ", 8);
          +		seq_puts(m, buf);
          +		kfree(buf);
          +		seq_putc(m, '\n');
          +		return 0;
          +	}
          +	seq_puts(m, saved_command_line);
          	seq_putc(m, '\n');
          	return 0;
           }
          diff --git a/fs/proc/bootconfig.c b/fs/proc/bootconfig.c
          index 123456789..987654321 100644
          --- a/fs/proc/bootconfig.c
          +++ b/fs/proc/bootconfig.c
          @@ -2,6 +2,8 @@
           #include <linux/fs.h>
           #include <linux/init.h>
           #include <linux/proc_fs.h>
           #include <linux/seq_file.h>
          +#include <linux/slab.h>
          +#include <linux/string.h>
           
           static int bootconfig_proc_show(struct seq_file *m, void *v)
           {
          +	char *p;
          +	char *buf;
          +	if (saved_bootconfig) {
          +		buf = kstrndup(saved_bootconfig, saved_bootconfig_size, GFP_KERNEL);
          +		if (buf) {
          +			if ((p = strstr(buf, "androidboot.verifiedbootstate = \"orange\""))) memcpy(p + 34, "green \"", 7);
          +			if ((p = strstr(buf, "androidboot.verifiedbootstate = \"yellow\""))) memcpy(p + 34, "green \"", 7);
          +			if ((p = strstr(buf, "androidboot.vbmeta.device_state = \"unlocked\""))) memcpy(p + 36, "locked  \"", 9);
          +			if ((p = strstr(buf, "androidboot.flash.locked = \"0\""))) memcpy(p + 29, "1\"", 2);
          +			if ((p = strstr(buf, "androidboot.mode = \"custom\""))) memcpy(p + 20, "normal\"", 7);
          +			if ((p = strstr(buf, "androidboot.secureboot = \"0\""))) memcpy(p + 26, "1\"", 2);
          +			if ((p = strstr(buf, "androidboot.lockstate = \"unlocked\""))) memcpy(p + 25, "locked  \"", 9);
          +			if ((p = strstr(buf, "androidboot.selinux = \"permissive\""))) memcpy(p + 23, "enforcing \"", 11);
          +			if ((p = strstr(buf, "buildvariant = \"userdebug\""))) memcpy(p + 16, "user     \"", 10);
          +			seq_puts(m, buf);
          +			kfree(buf);
          			return 0;
          		}
          		seq_write(m, saved_bootconfig, saved_bootconfig_size);
          	}
          	return 0;
          }
          diff --git a/kernel/kallsyms.c b/kernel/kallsyms.c
          index 126d4433d..7c02d5951 100644
          --- a/kernel/kallsyms.c
          +++ b/kernel/kallsyms.c
          @@ -25,6 +25,7 @@
           #include <linux/compiler.h>
           #include <linux/module.h>
           #include <linux/kernel.h>
          +#include <linux/cred.h>
           
           static void *s_start(struct seq_file *m, loff_t *pos)
           {
          +	if (current_uid().val >= 10000)
          +		return NULL;
          +
           	reset_iter(iter, *pos);
          EOF
          patch -p1 -N < full_complete_spoof.patch || echo "Patch applied or skipped"

          # 2. Apply Custom MGLRU Patch from Repository
          if [ -f "$GITHUB_WORKSPACE/.github/workflows/patches/mglru.patch" ]; then
            echo "=== Applying MGLRU Patch from repo ==="
            patch -p1 -N < "$GITHUB_WORKSPACE/.github/workflows/patches/mglru.patch" || echo "MGLRU patch applied with warnings"
          elif [ -f "$GITHUB_WORKSPACE/patches/mglru.patch" ]; then
            echo "=== Applying MGLRU Patch from repo ==="
            patch -p1 -N < "$GITHUB_WORKSPACE/patches/mglru.patch" || echo "MGLRU patch applied with warnings"
          fi

          # 3. Integrate SuSFS v2.2.0 Kernel Patches
          echo "=== 3. Integrating SuSFS v2.2.0 Engine ==="
          git clone --depth=1 -b gki-android12-5.10 https://gitlab.com/simonpunk/susfs4ksu.git ../susfs4ksu

          cp -rf ../susfs4ksu/kernel_patches/fs/* fs/
          cp -rf ../susfs4ksu/kernel_patches/include/linux/* include/linux/
          patch -p1 -N < ../susfs4ksu/kernel_patches/50_add_susfs_in_gki-android12-5.10.patch || true

          # Force SuSFS Kconfig symbols so self-heal script cannot strip them
          if ! grep -q "config KSU_SUSFS" fs/Kconfig; then
            echo '' >> fs/Kconfig
            echo 'menu "SuSFS Configuration"' >> fs/Kconfig
            echo 'config KSU_SUSFS' >> fs/Kconfig
            echo '	bool "Enable SuSFS support"' >> fs/Kconfig
            echo '	default y' >> fs/Kconfig
            echo 'config KSU_SUSFS_SUS_PATH' >> fs/Kconfig
            echo '	bool "Enable SUS Path"' >> fs/Kconfig
            echo '	depends on KSU_SUSFS' >> fs/Kconfig
            echo '	default y' >> fs/Kconfig
            echo 'config KSU_SUSFS_SUS_MOUNT' >> fs/Kconfig
            echo '	bool "Enable SUS Mount"' >> fs/Kconfig
            echo '	depends on KSU_SUSFS' >> fs/Kconfig
            echo '	default y' >> fs/Kconfig
            echo 'config KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT' >> fs/Kconfig
            echo '	bool "Auto add SUS KSU default mount"' >> fs/Kconfig
            echo '	depends on KSU_SUSFS' >> fs/Kconfig
            echo '	default y' >> fs/Kconfig
            echo 'config KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT' >> fs/Kconfig
            echo '	bool "Auto add SUS bind mount"' >> fs/Kconfig
            echo '	depends on KSU_SUSFS' >> fs/Kconfig
            echo '	default y' >> fs/Kconfig
            echo 'config KSU_SUSFS_SUS_KSTAT' >> fs/Kconfig
            echo '	bool "Enable SUS kstat"' >> fs/Kconfig
            echo '	depends on KSU_SUSFS' >> fs/Kconfig
            echo '	default y' >> fs/Kconfig
            echo 'config KSU_SUSFS_SUS_OVERLAYFS' >> fs/Kconfig
            echo '	bool "Enable SUS overlayfs"' >> fs/Kconfig
            echo '	depends on KSU_SUSFS' >> fs/Kconfig
            echo '	default y' >> fs/Kconfig
            echo 'config KSU_SUSFS_TRY_UMOUNT' >> fs/Kconfig
            echo '	bool "Enable try umount"' >> fs/Kconfig
            echo '	depends on KSU_SUSFS' >> fs/Kconfig
            echo '	default y' >> fs/Kconfig
            echo 'config KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT' >> fs/Kconfig
            echo '	bool "Auto add try umount for bind mount"' >> fs/Kconfig
            echo '	depends on KSU_SUSFS' >> fs/Kconfig
            echo '	default y' >> fs/Kconfig
            echo 'config KSU_SUSFS_SPOOF_UNAME' >> fs/Kconfig
            echo '	bool "Enable spoof uname"' >> fs/Kconfig
            echo '	depends on KSU_SUSFS' >> fs/Kconfig
            echo '	default y' >> fs/Kconfig
            echo 'config KSU_SUSFS_ENABLE_LOG' >> fs/Kconfig
            echo '	bool "Enable SuSFS log"' >> fs/Kconfig
            echo '	depends on KSU_SUSFS' >> fs/Kconfig
            echo '	default y' >> fs/Kconfig
            echo 'config KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS' >> fs/Kconfig
            echo '	bool "Hide SuSFS symbols"' >> fs/Kconfig
            echo '	depends on KSU_SUSFS' >> fs/Kconfig
            echo '	default y' >> fs/Kconfig
            echo 'config KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG' >> fs/Kconfig
            echo '	bool "Enable spoof cmdline or bootconfig"' >> fs/Kconfig
            echo '	depends on KSU_SUSFS' >> fs/Kconfig
            echo '	default y' >> fs/Kconfig
            echo 'config KSU_SUSFS_OPEN_REDIRECT' >> fs/Kconfig
            echo '	bool "Enable open redirect"' >> fs/Kconfig
            echo '	depends on KSU_SUSFS' >> fs/Kconfig
            echo '	default y' >> fs/Kconfig
            echo 'config KSU_SUSFS_SUS_MAP' >> fs/Kconfig
            echo '	bool "Enable sus map"' >> fs/Kconfig
            echo '	depends on KSU_SUSFS' >> fs/Kconfig
            echo '	default y' >> fs/Kconfig
            echo 'endmenu' >> fs/Kconfig
          fi

          # Ensure Makefile compiles susfs.o
          grep -q "susfs.o" fs/Makefile || echo "obj-\$(CONFIG_KSU_SUSFS) += susfs.o" >> fs/Makefile

          # Wild-Kernel 5.10 VMA_PAD_START & page_size_compat Fallbacks
          if grep -q 'VMA_PAD_START(' fs/proc/task_mmu.c && ! grep -qE '#include <linux/pgsize_migration(_inline)?\.h>|define VMA_PAD_START' fs/proc/task_mmu.c; then
            sed -i '1a #ifndef VMA_PAD_START\n#define VMA_PAD_START(vma) ((vma)->vm_end)\n#endif' fs/proc/task_mmu.c
            echo "Added VMA_PAD_START fallback definition to fs/proc/task_mmu.c"
          fi

          if grep -q '__fold_filemap_fixup_entry' fs/proc/task_mmu.c && ! grep -q '#include <linux/page_size_compat.h>' fs/proc/task_mmu.c; then
            sed -i '/#include <linux\/pkeys.h>/a #include <linux/page_size_compat.h>' fs/proc/task_mmu.c
            echo "Added page_size_compat.h include to fs/proc/task_mmu.c"
          fi

          # Wild-Kernel 5.10 set_nameidata 4-arg to 3-arg fix
          if grep -q 'set_nameidata(nd, old_dfd, fake_filename, NULL)' fs/namei.c; then
            echo "Fixing set_nameidata calls for 5.10 (4-arg -> 3-arg)"
            sed -i 's/set_nameidata(nd, old_dfd, fake_filename, NULL)/set_nameidata(nd, old_dfd, fake_filename)/g' fs/namei.c
          fi

          # 4. Integrate KernelSU-Next (pershoot/next-susfs)
          echo "=== 4. Setting up KernelSU-Next (pershoot/next-susfs) ==="
          curl -LSs "https://raw.githubusercontent.com/pershoot/KernelSU-Next/next-susfs/kernel/setup.sh" | bash -s next-susfs

          # 5. Method 3: Official Manual NoMount Dev Integration
          echo "=== 5. Executing Method 3: Manual NoMount Dev Integration ==="
          rm -rf fs/nomount nomount_temp
          sed -i '/nomount/d' fs/Makefile
          sed -i '/nomount/d' fs/Kconfig

          git clone --depth=1 -b dev https://github.com/maxsteeel/nomount nomount_temp
          mkdir -p fs/nomount
          if [ -d "nomount_temp/kernel/src" ]; then
            cp -rf nomount_temp/kernel/src/* fs/nomount/
          fi
          if [ -f "nomount_temp/kernel/Kconfig" ]; then
            cp -f nomount_temp/kernel/Kconfig fs/nomount/
          fi
          if [ -f "nomount_temp/kernel/Makefile" ]; then
            cp -f nomount_temp/kernel/Makefile fs/nomount/
          fi
          rm -rf nomount_temp

          echo 'source "fs/nomount/Kconfig"' >> fs/Kconfig
          echo 'obj-$(CONFIG_NOMOUNT) += nomount.o' >> fs/Makefile
          echo 'obj-$(CONFIG_NOMOUNT) += nomount/' >> fs/Makefile

          echo "KernelSU-Next, SuSFS v2.2.0, MGLRU, NoMount Dev & Full Spoofs applied successfully!"

      - name: Build kernel
        run: |
          ./build-kernel.sh ${{ inputs.ccache && '--ccache' || '' }}

      - name: Save ccache cache
        if: ${{ inputs.ccache && always() }}
        uses: actions/cache/save@v4
        with:
          path: work/.ccache
          key: cfx-ccache-${{ env.CLANG_ASSET }}-${{ inputs.kernel_repo }}-${{ inputs.kernel_branch }}

      - name: Publish release
        if: ${{ inputs.publish_release }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$RELEASE_TAG"
          if [ -z "$tag" ]; then
            tag="kernel-$(date -u +%Y%m%d)"
          fi
          cd "$GITHUB_WORKSPACE/work/dist"
          pkg="$GITHUB_WORKSPACE/work/pkg"
          mkdir -p "$pkg"
          assets=()
          for f in Image Image.lz4 vmlinux System.map ikconfig .config; do
            [ -f "$f" ] && assets+=("$f")
          done
          tar -I 'zstd -T0' -cf "$pkg/kernel-dist.tar.zst" .
          assets+=("$pkg/kernel-dist.tar.zst")
          
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" --clobber "${assets[@]}"
          else
            gh release create "$tag" \
              --title "Templar Kernel GKI $tag" \
              --notes "Built with KernelSU-Next (next-susfs), SuSFS v2.2.0, MGLRU, NoMount Dev & Full Spoofs. $(date -u '+%Y-%m-%d %H:%M UTC')" \
              "${assets[@]}"
          fi
          echo "release $tag updated"
