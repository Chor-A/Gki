name: build-kernel

on:
  schedule:
    - cron: "0 22 * * *" # Daily 3:30 AM IST (22:00 UTC)
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish the build as a GitHub release'
        type: boolean
        default: true
      release_tag:
        description: 'Release tag (auto-generated as kernel-YYYYMMDD when empty)'
        required: false
        default: ""
      kernel_repo:
        description: 'Kernel source repository (full URL)'
        required: false
        default: "https://github.com/Steambot12/Templar-Kernel-GKI-5.10"
      kernel_branch:
        description: 'Kernel source branch'
        required: false
        default: "Templar-LinuxStable"
      kernel_commit:
        description: 'Kernel source commit'
        required: false
        default: ""
      clang_version:
        description: Clang toolchain version
        required: false
        type: choice
        options:
          - clang 19
          - clang 14
        default: "clang 19"
      defconfig_fragment_exclude:
        description: 'Defconfig fragments to exclude'
        required: false
        default: ""
      append_build_env:
        description: 'Extra KEY=VALUE pairs appended to build.config'
        required: false
        default: ""
      append_config:
        description: 'Extra literal CONFIG_* lines injected into the defconfig'
        required: false
        default: "CONFIG_KSU=y,CONFIG_KSU_NEXT=y,CONFIG_OVERLAY_FS=y,CONFIG_KPROBES=y,CONFIG_HAVE_KPROBES=y,CONFIG_KPROBE_EVENTS=y,CONFIG_LRU_GEN=y,CONFIG_LRU_GEN_ENABLED=y,CONFIG_ZEROMOUNT=y"
      ccache:
        description: 'Accelerate with ccache.'
        type: boolean
        default: true

permissions:
  contents: write
  actions: write

concurrency:
  group: kernel-build-${{ github.event.inputs.release_tag || 'default' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      KERNEL_REPO: ${{ inputs.kernel_repo }}
      KERNEL_BRANCH: ${{ inputs.kernel_branch }}
      KERNEL_COMMIT: ${{ inputs.kernel_commit }}
      CLANG_ASSET: ${{ fromJSON('{"clang 14":"clang-r450784e-linux-x86.tar.zst","clang 19":"clang-r536225-linux-x86.tar.zst"}')[inputs.clang_version] }}
      DEFCONFIG_FRAGMENT_EXCLUDE: ${{ inputs.defconfig_fragment_exclude }}
      APPEND_BUILD_ENV: ${{ inputs.append_build_env }}
      APPEND_CONFIG: ${{ inputs.append_config }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      CCACHE_OPT: ${{ inputs.ccache && '1' || '' }}
      GITHUB_TOKEN: ${{ github.token }}
      KMI_SYMBOL_LIST_STRICT_MODE: "0"
      UPDATE_SYMBOL_LIST: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Free disk space & Install AST Semantic Tools
        run: |
          if [ -f "build/free-disk-space.sh" ]; then
            sudo bash build/free-disk-space.sh
          fi
          echo "Installing AST Semantic Matching Tools..."
          sudo apt-get update -y
          sudo apt-get install -y coccinelle clang llvm libclang-dev dos2unix python3-dev
          python3 -m pip install --upgrade pip
          pip3 install tree-sitter tree-sitter-c clang
          df -h

      - name: Configure Git Safe Directory
        run: |
          git config --global --add safe.directory "*"

      - name: Restore ccache cache
        if: ${{ inputs.ccache }}
        uses: actions/cache@v4
        with:
          path: work/.ccache
          key: cfx-ccache-${{ env.CLANG_ASSET }}-${{ inputs.kernel_repo }}-${{ inputs.kernel_branch }}-${{ github.run_id }}
          restore-keys: |
            cfx-ccache-${{ env.CLANG_ASSET }}-${{ inputs.kernel_repo }}-${{ inputs.kernel_branch }}-
            cfx-ccache-${{ env.CLANG_ASSET }}-${{ inputs.kernel_repo }}-
          fail-on-cache-miss: false

      - name: Add 24G swap
        run: |
          sudo swapoff -a || true
          sudo rm -f /swapfile
          sudo fallocate -l 24G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=24576
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: Clone Kernel Source
        run: |
          mkdir -p work
          git clone -b ${{ env.KERNEL_BRANCH }} ${{ env.KERNEL_REPO }} work/common
          cd work/common

          if [ -n "${{ env.KERNEL_COMMIT }}" ]; then
            git checkout ${{ env.KERNEL_COMMIT }}
          fi
          
          git config --global user.email "Antonio_Nelson@proton.me"
          git config --global user.name "Chor-A"
          git revert --no-edit 3be84ff || echo "Commit 3be84ff clean"

      - name: Apply SUSFS & Custom Patches with Strict Verification
        run: |
          cd work/common

          echo "=== 1. Integrating SUSFS into Kernel ==="
          git clone --depth=1 -b gki-android12-5.10 https://gitlab.com/simonpunk/susfs4ksu.git ../susfs4ksu
          cp -r ../susfs4ksu/kernel_patches/fs/* fs/
          cp -r ../susfs4ksu/kernel_patches/include/linux/* include/linux/

          # Strict check: heal headers
          dos2unix ../susfs4ksu/kernel_patches/50_add_susfs_in_gki-android12-5.10.patch
          patch -p1 --no-backup-if-mismatch < ../susfs4ksu/kernel_patches/50_add_susfs_in_gki-android12-5.10.patch || echo "SUSFS Already Merged or Patch Missing"

          echo "=== 2. Applying Custom Patches with Zero-Guessing Rule ==="
          for dir in "$GITHUB_WORKSPACE/.github/workflows/patches" "$GITHUB_WORKSPACE/patches"; do
            if [ -d "$dir" ]; then
              for patch_file in "$dir"/*.patch; do
                if [ -f "$patch_file" ]; then
                  echo "Applying $patch_file..."
                  dos2unix "$patch_file"
                  
                  # Non-blind check
                  if git apply --check "$patch_file"; then
                    git apply --verbose "$patch_file"
                    echo "✅ Cleanly applied $patch_file"
                  elif patch -p1 -N --no-backup-if-mismatch < "$patch_file"; then
                    echo "✅ Cleanly applied $patch_file via strict patch utility"
                  else
                    echo "❌ ERROR: Patch $patch_file failed strict verification! Aborting to prevent malformation."
                    exit 1
                  fi
                fi
              done
            fi
          done

      - name: Inject ZeroMount Subsystem
        run: |
          cd work/common

          echo "Generating ZeroMount Full Header"
          cat << 'EOF_ZM_H' > include/linux/zeromount.h
          #ifndef _LINUX_ZEROMOUNT_H
          #define _LINUX_ZEROMOUNT_H

          #include <linux/types.h>
          #include <linux/list.h>
          #include <linux/hashtable.h>
          #include <linux/spinlock.h>
          #include <linux/limits.h>
          #include <linux/atomic.h>
          #include <linux/uidgid.h>
          #include <linux/stat.h>
          #include <linux/ioctl.h>
          #include <linux/rcupdate.h>
          #include <linux/printk.h>
          #include <linux/sched.h>
          #include <linux/bitops.h>

          #define ZM_BLOOM_BITS     4096
          #define ZM_BLOOM_SHIFT    12
          #define ZM_BLOOM_MASK     (ZM_BLOOM_BITS - 1)

          #ifdef CONFIG_ANDROID_VENDOR_OEM_DATA
          #define ZM_RECURSIVE_BIT 0
          static inline void zm_enter(void) { set_bit(ZM_RECURSIVE_BIT, (unsigned long *)&current->android_oem_data1); }
          static inline void zm_exit(void) { clear_bit(ZM_RECURSIVE_BIT, (unsigned long *)&current->android_oem_data1); }
          static inline bool zm_is_recursive(void) { return test_bit(ZM_RECURSIVE_BIT, (unsigned long *)&current->android_oem_data1); }
          #else
          static DEFINE_PER_CPU(int, zm_recursion_guard);
          static inline void zm_enter(void) { this_cpu_inc(zm_recursion_guard); }
          static inline void zm_exit(void) { this_cpu_dec(zm_recursion_guard); }
          static inline bool zm_is_recursive(void) { return this_cpu_read(zm_recursion_guard) > 1; }
          #endif

          extern int zeromount_debug_level;
          #define ZM_LOG(level, fmt, ...) do { if (zeromount_debug_level >= (level) && printk_ratelimit()) pr_info("ZeroMount: " fmt, ##__VA_ARGS__); } while (0)
          #define ZM_TRACE(fmt, ...) ZM_LOG(3, fmt, ##__VA_ARGS__)
          #define ZM_DBG(fmt, ...)  ZM_LOG(2, fmt, ##__VA_ARGS__)
          #define ZM_INFO(fmt, ...) ZM_LOG(1, fmt, ##__VA_ARGS__)
          #define ZM_ERR(fmt, ...)  pr_err("ZeroMount: " fmt, ##__VA_ARGS__)

          #define ZEROMOUNT_MAGIC_CODE	0x5A
          #define ZEROMOUNT_VERSION	1
          #define ZEROMOUNT_HASH_BITS	10
          #define ZM_FLAG_ACTIVE		(1 << 0)
          #define ZM_FLAG_IS_DIR		(1 << 7)
          #define ZEROMOUNT_MAGIC_POS	0x7000000000000000ULL

          #define ZEROMOUNT_IOC_MAGIC	ZEROMOUNT_MAGIC_CODE
          #define ZEROMOUNT_IOC_ADD_RULE	_IOW(ZEROMOUNT_IOC_MAGIC, 1, struct zeromount_ioctl_data)
          #define ZEROMOUNT_IOC_DEL_RULE	_IOW(ZEROMOUNT_IOC_MAGIC, 2, struct zeromount_ioctl_data)
          #define ZEROMOUNT_IOC_CLEAR_ALL	_IO(ZEROMOUNT_IOC_MAGIC, 3)
          #define ZEROMOUNT_IOC_GET_VERSION _IOR(ZEROMOUNT_IOC_MAGIC, 4, int)
          #define ZEROMOUNT_IOC_ADD_UID	_IOW(ZEROMOUNT_IOC_MAGIC, 5, unsigned int)
          #define ZEROMOUNT_IOC_DEL_UID	_IOW(ZEROMOUNT_IOC_MAGIC, 6, unsigned int)
          #define ZEROMOUNT_IOC_GET_LIST	_IOR(ZEROMOUNT_IOC_MAGIC, 7, int)
          #define ZEROMOUNT_IOC_ENABLE	_IO(ZEROMOUNT_IOC_MAGIC, 8)
          #define ZEROMOUNT_IOC_DISABLE	_IO(ZEROMOUNT_IOC_MAGIC, 9)
          #define ZEROMOUNT_IOC_REFRESH	_IO(ZEROMOUNT_IOC_MAGIC, 10)
          #define ZEROMOUNT_IOC_GET_STATUS _IOR(ZEROMOUNT_IOC_MAGIC, 11, int)
          #define MAX_LIST_BUFFER_SIZE	(64 * 1024)

          struct zeromount_ioctl_data {
          	char __user *virtual_path;
          	char __user *real_path;
          	unsigned int flags;
          };

          struct zeromount_rule {
          	struct hlist_node node;
          	struct hlist_node ino_node;
          	struct list_head list;
          	size_t vp_len;
          	char *virtual_path;
          	char *real_path;
          	unsigned long real_ino;
          	dev_t real_dev;
          	unsigned long v_ino;
          	dev_t v_dev;
          	bool is_new;
          	u32 flags;
          	struct rcu_head rcu;
          };

          struct zeromount_dir_node {
          	struct hlist_node node;
          	char *dir_path;
          	struct list_head children_names;
          	struct rcu_head rcu;
          };

          struct zeromount_child_name {
          	struct list_head list;
          	char *name;
          	unsigned char d_type;
          	struct rcu_head rcu;
          };

          struct zeromount_uid_node {
          	uid_t uid;
          	struct hlist_node node;
          	struct rcu_head rcu;
          };

          extern DECLARE_HASHTABLE(zeromount_rules_ht, ZEROMOUNT_HASH_BITS);
          extern DECLARE_HASHTABLE(zeromount_dirs_ht, ZEROMOUNT_HASH_BITS);
          extern DECLARE_HASHTABLE(zeromount_uid_ht, ZEROMOUNT_HASH_BITS);
          extern DECLARE_HASHTABLE(zeromount_ino_ht, ZEROMOUNT_HASH_BITS);
          extern struct list_head zeromount_rules_list;
          extern spinlock_t zeromount_lock;

          #ifdef CONFIG_ZEROMOUNT
          extern atomic_t zeromount_enabled;

          bool zeromount_should_skip(void);
          char *zeromount_resolve_path(const char *pathname);
          char *zeromount_build_absolute_path(int dfd, const char *name);
          struct filename *zeromount_getname_hook(struct filename *name);
          void zeromount_inject_dents_common(struct file *file, void __user **dirent, int *count, loff_t *pos, int compat);
          void zeromount_inject_dents64(struct file *file, void __user **dirent, int *count, loff_t *pos);
          void zeromount_inject_dents(struct file *file, void __user **dirent, int *count, loff_t *pos);
          char *zeromount_get_virtual_path_for_inode(struct inode *inode);
          char *zeromount_get_static_vpath(struct inode *inode);
          void zeromount_spoof_mmap_metadata(struct inode *inode, dev_t *dev, unsigned long *ino);
          bool zeromount_is_traversal_allowed(struct inode *inode, int mask);
          bool zeromount_is_injected_file(struct inode *inode);
          bool zeromount_is_uid_blocked(uid_t uid);
          int zeromount_spoof_statfs(const char __user *pathname, struct kstatfs *buf);
          ssize_t zeromount_spoof_xattr(struct dentry *dentry, const char *name, void *value, size_t size);
          #else
          static inline bool zeromount_should_skip(void) { return true; }
          static inline char *zeromount_resolve_path(const char *p) { return NULL; }
          static inline char *zeromount_build_absolute_path(int dfd, const char *name) { return NULL; }
          static inline struct filename *zeromount_getname_hook(struct filename *name) { return name; }
          static inline void zeromount_inject_dents_common(struct file *f, void __user **d, int *c, loff_t *p, int compat) {}
          static inline void zeromount_inject_dents64(struct file *f, void __user **d, int *c, loff_t *p) {}
          static inline void zeromount_inject_dents(struct file *f, void __user **d, int *c, loff_t *p) {}
          static inline char *zeromount_get_virtual_path_for_inode(struct inode *inode) { return NULL; }
          static inline char *zeromount_get_static_vpath(struct inode *inode) { return NULL; }
          static inline void zeromount_spoof_mmap_metadata(struct inode *inode, dev_t *dev, unsigned long *ino) {}
          static inline bool zeromount_is_traversal_allowed(struct inode *inode, int mask) { return false; }
          static inline bool zeromount_is_injected_file(struct inode *inode) { return false; }
          static inline bool zeromount_is_uid_blocked(uid_t uid) { return false; }
          static inline int zeromount_spoof_statfs(const char __user *p, struct kstatfs *b) { return 0; }
          static inline ssize_t zeromount_spoof_xattr(struct dentry *d, const char *n, void *v, size_t s) { return -EOPNOTSUPP; }
          #endif
          #endif
          EOF_ZM_H

          echo "Generating ZeroMount Implementation"
          cat << 'EOF_ZM_C' > fs/zeromount.c
          #include <linux/module.h>
          #include <linux/kernel.h>
          #include <linux/init.h>
          #include <linux/fs.h>
          #include <linux/dcache.h>
          #include <linux/path.h>
          #include <linux/namei.h>
          #include <linux/sched.h>
          #include <linux/slab.h>
          #include <linux/string.h>
          #include <linux/uaccess.h>
          #include <linux/dirent.h>
          #include <linux/miscdevice.h>
          #include <linux/cred.h>
          #include <linux/vmalloc.h>
          #include <linux/mm.h>
          #include <linux/zeromount.h>
          #include <linux/kobject.h>
          #include <linux/sysfs.h>
          #include <linux/statfs.h>
          #include <linux/file.h>
          #include <linux/fs_struct.h>
          #ifdef CONFIG_KSU_SUSFS
          #include <linux/susfs.h>
          #endif
          #include <linux/reboot.h>
          #include <linux/bitmap.h>

          int zeromount_debug_level = 0;
          DEFINE_HASHTABLE(zeromount_rules_ht, ZEROMOUNT_HASH_BITS);
          DEFINE_HASHTABLE(zeromount_dirs_ht, ZEROMOUNT_HASH_BITS);
          DEFINE_HASHTABLE(zeromount_uid_ht, ZEROMOUNT_HASH_BITS);
          DEFINE_HASHTABLE(zeromount_ino_ht, ZEROMOUNT_HASH_BITS);
          LIST_HEAD(zeromount_rules_list);
          DEFINE_SPINLOCK(zeromount_lock);
          atomic_t zeromount_enabled = ATOMIC_INIT(0);
          static atomic_t zeromount_dirs_count = ATOMIC_INIT(0);
          static atomic_t zeromount_rule_count = ATOMIC_INIT(0);
          static DECLARE_BITMAP(zm_bloom, ZM_BLOOM_BITS);
          #define ZEROMOUNT_DISABLED() (atomic_read(&zeromount_enabled) == 0)

          static inline void zm_bloom_add(u32 hash)
          {
          	set_bit(hash & ZM_BLOOM_MASK, zm_bloom);
          	set_bit((hash >> 10) & ZM_BLOOM_MASK, zm_bloom);
          	set_bit((hash >> 20) & ZM_BLOOM_MASK, zm_bloom);
          }

          static inline bool zm_bloom_test(u32 hash)
          {
          	return test_bit(hash & ZM_BLOOM_MASK, zm_bloom) &&
          	       test_bit((hash >> 10) & ZM_BLOOM_MASK, zm_bloom) &&
          	       test_bit((hash >> 20) & ZM_BLOOM_MASK, zm_bloom);
          }

          static void zm_bloom_rebuild(void)
          {
          	struct zeromount_rule *rule;
          	int count = 0;
          	bitmap_zero(zm_bloom, ZM_BLOOM_BITS);
          	list_for_each_entry(rule, &zeromount_rules_list, list) {
          		u32 h = full_name_hash(NULL, rule->virtual_path, rule->vp_len);
          		zm_bloom_add(h);
          		count++;
          	}
          	ZM_DBG("bloom: rebuilt (%d rules)\n", count);
          }

          struct linux_dirent {
          	unsigned long	d_ino;
          	unsigned long	d_off;
          	unsigned short	d_reclen;
          	char		d_name[];
          };

          static unsigned long zm_ino_adb = 0;
          static unsigned long zm_ino_modules = 0;

          static inline bool zeromount_is_critical_process(void)
          {
          	const char *comm = current->comm;
          	if (current->pid <= 1 || is_global_init(current)) return true;
          	switch (comm[0]) {
          	case 'i': if (comm[1] == 'n' && comm[2] == 'i') return true; break;
          	case 'u': if (comm[1] == 'e' && comm[2] == 'v') return true; break;
          	case 'v': if (comm[1] == 'o' && comm[2] == 'l') return true; break;
          	}
          	if (current->flags & PF_KTHREAD) return true;
          	return false;
          }

          bool zeromount_should_skip(void)
          {
          	if (ZEROMOUNT_DISABLED()) return true;
          	if (zm_is_recursive()) return true;
          	if (unlikely(in_interrupt() || in_nmi() || oops_in_progress)) return true;
          	if (!current || !current->mm) return true;
          	if (current->flags & PF_EXITING) return true;
          	if (zeromount_is_critical_process()) return true;
          #ifdef CONFIG_KSU_SUSFS
          	if (susfs_is_current_proc_umounted()) return true;
          #endif
          	return false;
          }
          EXPORT_SYMBOL(zeromount_should_skip);

          bool zeromount_is_uid_blocked(uid_t uid)
          {
          	struct zeromount_uid_node *entry;
          	if (ZEROMOUNT_DISABLED()) return false;
          #ifdef CONFIG_KSU_SUSFS
          	if (susfs_is_current_proc_umounted()) return true;
          #endif
          	rcu_read_lock();
          	hash_for_each_possible_rcu(zeromount_uid_ht, entry, node, uid) {
          		if (entry->uid == uid) {
          			rcu_read_unlock();
          			return true;
          		}
          	}
          	rcu_read_unlock();
          	return false;
          }
          EXPORT_SYMBOL(zeromount_is_uid_blocked);

          static inline void zeromount_normalize_inline(const char *path, const char **out_p, size_t *out_len)
          {
          	const char *p = path;
          	size_t len;
          	if (strncmp(path, "/system/", 8) == 0) p = path + 7;
          	len = strlen(p);
          	while (len > 1 && p[len - 1] == '/') len--;
          	*out_p = p;
          	*out_len = len;
          }

          static char *zeromount_normalize_path(const char *path)
          {
          	const char *p;
          	size_t len;
          	char *normalized;
          	if (!path) return NULL;
          	zeromount_normalize_inline(path, &p, &len);
          	normalized = kmalloc(len + 1, GFP_KERNEL);
          	if (!normalized) return NULL;
          	memcpy(normalized, p, len);
          	normalized[len] = '\0';
          	return normalized;
          }

          static void zeromount_free_rule_rcu(struct rcu_head *head)
          {
          	struct zeromount_rule *rule = container_of(head, struct zeromount_rule, rcu);
          	kfree(rule->virtual_path);
          	kfree(rule->real_path);
          	kfree(rule);
          }

          static void zeromount_free_child_rcu(struct rcu_head *head)
          {
          	struct zeromount_child_name *child = container_of(head, struct zeromount_child_name, rcu);
          	kfree(child->name);
          	kfree(child);
          }

          static void zeromount_free_dir_node_rcu(struct rcu_head *head)
          {
          	struct zeromount_dir_node *node = container_of(head, struct zeromount_dir_node, rcu);
          	kfree(node->dir_path);
          	kfree(node);
          }

          static void zeromount_flush_parent(const char *full_path)
          {
          	char *path_copy, *last_slash, *parent_str, *child_name;
          	struct path parent;
          	path_copy = kstrdup(full_path, GFP_KERNEL);
          	if (!path_copy) return;
          	last_slash = strrchr(path_copy, '/');
          	if (!last_slash || last_slash == path_copy) { kfree(path_copy); return; }
          	*last_slash = '\0';
          	parent_str = path_copy;
          	child_name = last_slash + 1;
          	if (*child_name == '\0') { kfree(path_copy); return; }
          	if (kern_path(parent_str, LOOKUP_FOLLOW, &parent) == 0) {
          		struct dentry *child;
          		inode_lock(parent.dentry->d_inode);
          		child = lookup_one_len(child_name, parent.dentry, strlen(child_name));
          		if (!IS_ERR(child)) {
          			d_invalidate(child);
          			d_drop(child);
          			dput(child);
          		}
          		inode_unlock(parent.dentry->d_inode);
          		path_put(&parent);
          	}
          	kfree(path_copy);
          }

          static void zeromount_flush_dcache(const char *path_name)
          {
          	struct path path;
          	int err;
          	zm_enter();
          	err = kern_path(path_name, LOOKUP_FOLLOW, &path);
          	if (!err) {
          		d_invalidate(path.dentry);
          		d_drop(path.dentry);
          		path_put(&path);
          	} else if (err == -ENOENT) {
          		zeromount_flush_parent(path_name);
          	}
          	zm_exit();
          }

          static void zeromount_force_refresh_all(void)
          {
          	struct zeromount_rule *rule;
          	char **paths = NULL;
          	int count = 0, i = 0;
          	spin_lock(&zeromount_lock);
          	list_for_each_entry(rule, &zeromount_rules_list, list) count++;
          	spin_unlock(&zeromount_lock);
          	if (count == 0) return;
          	paths = kvmalloc_array(count, sizeof(char *), GFP_KERNEL);
          	if (!paths) return;
          	spin_lock(&zeromount_lock);
          	list_for_each_entry(rule, &zeromount_rules_list, list) {
          		if (i >= count) break;
          		paths[i] = kstrdup(rule->virtual_path, GFP_ATOMIC);
          		if (!paths[i]) break;
          		i++;
          	}
          	spin_unlock(&zeromount_lock);
          	for (count = i, i = 0; i < count; i++) {
          		zeromount_flush_dcache(paths[i]);
          		kfree(paths[i]);
          	}
          	kvfree(paths);
          }

          static unsigned long zeromount_generate_ino(const char *dir, const char *name)
          {
          	u32 h1 = full_name_hash(NULL, dir, strlen(dir));
          	u32 h2 = full_name_hash(NULL, name, strlen(name));
          	return (unsigned long)(h1 ^ h2);
          }

          char *zeromount_get_virtual_path_for_inode(struct inode *inode)
          {
          	struct zeromount_rule *rule;
          	unsigned long key;
          	char *found_path = NULL;
          	if (!inode || !inode->i_sb || zeromount_should_skip()) return NULL;
          	if (zeromount_is_uid_blocked(current_uid().val)) return NULL;
          #ifdef CONFIG_KSU_SUSFS
          	if (susfs_is_current_proc_umounted()) return NULL;
          #endif
          	key = inode->i_ino ^ inode->i_sb->s_dev;
          	if (atomic_read(&zeromount_rule_count) == 0) return NULL;
          	rcu_read_lock();
          	hash_for_each_possible_rcu(zeromount_ino_ht, rule, ino_node, key) {
          		if (rule->real_ino == inode->i_ino && rule->real_dev == inode->i_sb->s_dev) {
          			if (READ_ONCE(rule->is_new)) found_path = kstrdup(rule->virtual_path, GFP_ATOMIC);
          			break;
          		}
          	}
          	rcu_read_unlock();
          	return found_path;
          }
          EXPORT_SYMBOL(zeromount_get_virtual_path_for_inode);

          char *zeromount_get_static_vpath(struct inode *inode)
          {
          	struct zeromount_rule *rule;
          	unsigned long key;
          	char *copy = NULL;
          	if (unlikely(!inode || !inode->i_sb)) return NULL;
          	key = inode->i_ino ^ inode->i_sb->s_dev;
          	rcu_read_lock();
          	hash_for_each_possible_rcu(zeromount_ino_ht, rule, ino_node, key) {
          		if (rule->real_ino == inode->i_ino && rule->real_dev == inode->i_sb->s_dev && (rule->flags & ZM_FLAG_ACTIVE)) {
          			copy = kstrdup(rule->virtual_path, GFP_ATOMIC);
          			break;
          		}
          	}
          	rcu_read_unlock();
          	return copy;
          }
          EXPORT_SYMBOL(zeromount_get_static_vpath);

          void zeromount_spoof_mmap_metadata(struct inode *inode, dev_t *dev, unsigned long *ino)
          {
          	struct zeromount_rule *rule;
          	unsigned long key;
          	if (unlikely(!inode || !dev || !ino) || zeromount_should_skip()) return;
          	key = inode->i_ino ^ inode->i_sb->s_dev;
          	rcu_read_lock();
          	hash_for_each_possible_rcu(zeromount_ino_ht, rule, ino_node, key) {
          		if (rule->real_ino == inode->i_ino && rule->real_dev == inode->i_sb->s_dev && (rule->flags & ZM_FLAG_ACTIVE)) {
          			*dev = READ_ONCE(rule->v_dev);
          			*ino = READ_ONCE(rule->v_ino);
          			break;
          		}
          	}
          	rcu_read_unlock();
          }
          EXPORT_SYMBOL(zeromount_spoof_mmap_metadata);

          static unsigned long zeromount_get_inode_by_path(const char *path_str)
          {
          	struct path path;
          	struct inode *inode;
          	unsigned long ino = 0;
          	if (kern_path(path_str, LOOKUP_FOLLOW, &path) == 0) {
          		inode = d_backing_inode(path.dentry);
          		if (inode) ino = inode->i_ino;
          		path_put(&path);
          	}
          	return ino;
          }

          static void zeromount_refresh_critical_inodes(void)
          {
          	if (READ_ONCE(zm_ino_adb) == 0) {
          		unsigned long ino = zeromount_get_inode_by_path("/data/adb");
          		if (ino != 0) WRITE_ONCE(zm_ino_adb, ino);
          	}
          	if (READ_ONCE(zm_ino_modules) == 0) {
          		unsigned long ino = zeromount_get_inode_by_path("/data/adb/modules");
          		if (ino != 0) WRITE_ONCE(zm_ino_modules, ino);
          	}
          }

          bool zeromount_is_traversal_allowed(struct inode *inode, int mask)
          {
          	if (!inode || zeromount_should_skip() || zeromount_is_uid_blocked(current_uid().val)) return false;
          #ifdef CONFIG_KSU_SUSFS
          	if (susfs_is_current_proc_umounted()) return false;
          #endif
          	if (!(mask & MAY_EXEC)) return false;
          	if ((READ_ONCE(zm_ino_adb) != 0 && inode->i_ino == READ_ONCE(zm_ino_adb)) ||
          	    (READ_ONCE(zm_ino_modules) != 0 && inode->i_ino == READ_ONCE(zm_ino_modules))) return true;
          	return false;
          }
          EXPORT_SYMBOL(zeromount_is_traversal_allowed);

          bool zeromount_is_injected_file(struct inode *inode)
          {
          	struct zeromount_rule *rule;
          	unsigned long key;
          	if (!inode || !inode->i_sb || zeromount_should_skip()) return false;
          #ifdef CONFIG_KSU_SUSFS
          	if (susfs_is_current_proc_umounted()) return false;
          #endif
          	key = inode->i_ino ^ inode->i_sb->s_dev;
          	if (atomic_read(&zeromount_rule_count) == 0) return false;
          	rcu_read_lock();
          	hash_for_each_possible_rcu(zeromount_ino_ht, rule, ino_node, key) {
          		if (rule->real_ino == inode->i_ino && rule->real_dev == inode->i_sb->s_dev) {
          			rcu_read_unlock();
          			return true;
          		}
          	}
          	rcu_read_unlock();
          	return false;
          }
          EXPORT_SYMBOL(zeromount_is_injected_file);

          char *zeromount_resolve_path(const char *pathname)
          {
          	struct zeromount_rule *rule;
          	char *target = NULL;
          	const char *normalized;
          	size_t norm_len;
          	u32 hash;
          	if (zeromount_is_critical_process()) return NULL;
          #ifdef CONFIG_KSU_SUSFS
          	if (susfs_is_current_proc_umounted()) return NULL;
          #endif
          	if (ZEROMOUNT_DISABLED() || zeromount_is_uid_blocked(current_uid().val) || !pathname) return NULL;

          	zeromount_normalize_inline(pathname, &normalized, &norm_len);
          	hash = full_name_hash(NULL, normalized, norm_len);
          	if (atomic_read(&zeromount_rule_count) == 0) return NULL;
          	if (!zm_bloom_test(hash)) return NULL;

          	rcu_read_lock();
          	hash_for_each_possible_rcu(zeromount_rules_ht, rule, node, hash) {
          		if (rule->vp_len == norm_len && memcmp(normalized, rule->virtual_path, norm_len) == 0) {
          			if (rule->flags & ZM_FLAG_ACTIVE) {
          				target = kstrdup(rule->real_path, GFP_ATOMIC);
          				break;
          			}
          		}
          	}
          	rcu_read_unlock();
          	return target;
          }
          EXPORT_SYMBOL(zeromount_resolve_path);

          static char *zeromount_resolve_dirfd_path(int dfd, char *buf, int buflen)
          {
          	struct fd f;
          	char *path;
          	if (dfd == AT_FDCWD) {
          		struct path pwd;
          		if (unlikely(!current->fs)) return ERR_PTR(-ENOENT);
          		get_fs_pwd(current->fs, &pwd);
          		path = d_path(&pwd, buf, buflen);
          		path_put(&pwd);
          		return path;
          	}
          	f = fdget(dfd);
          	if (!f.file) return ERR_PTR(-EBADF);
          	path = d_path(&f.file->f_path, buf, buflen);
          	fdput(f);
          	return path;
          }

          char *zeromount_build_absolute_path(int dfd, const char *name)
          {
          	char *page_buf, *dir_path, *abs_path;
          	size_t dir_len, name_len;

          	if (!name || name[0] == '/' || *name == '\0') return NULL;
          	if (zeromount_should_skip() || zeromount_is_uid_blocked(current_uid().val)) return NULL;

          	page_buf = __getname();
          	if (!page_buf) return NULL;
          	dir_path = zeromount_resolve_dirfd_path(dfd, page_buf, PATH_MAX);
          	if (IS_ERR(dir_path)) { __putname(page_buf); return NULL; }
          	dir_len = strlen(dir_path);
          	name_len = strlen(name);
          	if (dir_len > PATH_MAX || name_len > NAME_MAX || dir_len + name_len + 2 > PATH_MAX) { __putname(page_buf); return NULL; }
          	abs_path = kmalloc(dir_len + 1 + name_len + 1, GFP_KERNEL);
          	if (abs_path) {
          		memcpy(abs_path, dir_path, dir_len);
          		abs_path[dir_len] = '/';
          		memcpy(abs_path + dir_len + 1, name, name_len + 1);
          	}
          	__putname(page_buf);
          	return abs_path;
          }
          EXPORT_SYMBOL(zeromount_build_absolute_path);

          struct filename *zeromount_getname_hook(struct filename *name)
          {
          	char *target_path;
          	struct filename *new_name;

          	if (zeromount_should_skip() || zeromount_is_uid_blocked(current_uid().val) || !name || name->name[0] != '/')
          		return name;
          #ifdef CONFIG_KSU_SUSFS
          	if (susfs_is_current_proc_umounted()) return name;
          #endif

          	zm_enter();
          	target_path = zeromount_resolve_path(name->name);
          	if (!target_path) { zm_exit(); return name; }
          	new_name = getname_kernel(target_path);
          	kfree(target_path);
          	if (IS_ERR(new_name)) { zm_exit(); return name; }
          	putname(name);
          	zm_exit();
          	return new_name;
          }

          void zeromount_inject_dents_common(struct file *file, void __user **dirent, int *count, loff_t *pos, int compat)
          {
          	char *page_buf, *dir_path;
          	unsigned long v_index;

          	if (zeromount_should_skip() || zeromount_is_uid_blocked(current_uid().val)) return;
          #ifdef CONFIG_KSU_SUSFS
          	if (susfs_is_current_proc_umounted()) return;
          #endif
          	if (atomic_read(&zeromount_dirs_count) == 0 && *pos < ZEROMOUNT_MAGIC_POS) return;

          	page_buf = __getname();
          	if (!page_buf) return;

          	dir_path = d_path(&file->f_path, page_buf, PAGE_SIZE);
          	if (IS_ERR(dir_path)) { __putname(page_buf); return; }

          	{
          		const char *norm_p;
          		size_t norm_len;
          		u32 dir_hash;
          		bool is_redirected = false;

          		zeromount_normalize_inline(dir_path, &norm_p, &norm_len);
          		dir_hash = full_name_hash(NULL, norm_p, norm_len);
          		rcu_read_lock();
          		{
          			struct zeromount_rule *rule;
          			hash_for_each_possible_rcu(zeromount_rules_ht, rule, node, dir_hash) {
          				if (rule->vp_len == norm_len && memcmp(norm_p, rule->virtual_path, norm_len) == 0 && (rule->flags & ZM_FLAG_ACTIVE)) {
          					is_redirected = true;
          					break;
          				}
          			}
          		}
          		rcu_read_unlock();
          		if (is_redirected) { __putname(page_buf); return; }
          	}

          	if (*pos >= ZEROMOUNT_MAGIC_POS) v_index = *pos - ZEROMOUNT_MAGIC_POS;
          	else v_index = 0;

          	{
          		struct zeromount_dir_node *zm_dir;
          		struct zeromount_child_name *zm_child;
          		const char *normalized;
          		size_t normalized_len;
          		u32 zm_hash;
          		unsigned long cur_idx = 0;

          		zeromount_normalize_inline(dir_path, &normalized, &normalized_len);
          		zm_hash = full_name_hash(NULL, normalized, normalized_len);
          		rcu_read_lock();
          		hash_for_each_possible_rcu(zeromount_dirs_ht, zm_dir, node, zm_hash) {
          			if (strlen(zm_dir->dir_path) != normalized_len || memcmp(normalized, zm_dir->dir_path, normalized_len) != 0) continue;
          			if (*pos < ZEROMOUNT_MAGIC_POS) *pos = ZEROMOUNT_MAGIC_POS;
          			list_for_each_entry_rcu(zm_child, &zm_dir->children_names, list) {
          				char name_local[256];
          				unsigned char type_local;
          				int name_len, reclen;
          				unsigned long fake_ino;
          				if (cur_idx++ < v_index) continue;
          				strscpy(name_local, zm_child->name, sizeof(name_local));
          				type_local = zm_child->d_type;
          				name_len = strlen(name_local);
          				if (compat) {
          					struct linux_dirent __user *de;
          					reclen = ALIGN(offsetof(struct linux_dirent, d_name) + name_len + 2, 4);
          					if (*count < reclen) break;
          					de = (struct linux_dirent __user *)*dirent;
          					fake_ino = zeromount_generate_ino(dir_path, name_local);
          					if (put_user(fake_ino, &de->d_ino) || put_user(ZEROMOUNT_MAGIC_POS + v_index + 1, &de->d_off) || put_user(reclen, &de->d_reclen) || copy_to_user(de->d_name, name_local, name_len) || put_user(0, de->d_name + name_len) || put_user(type_local, ((char __user *)de) + reclen - 1)) break;
          				} else {
          					struct linux_dirent64 __user *de64;
          					reclen = ALIGN(offsetof(struct linux_dirent64, d_name) + name_len + 1, sizeof(u64));
          					if (*count < reclen) break;
          					de64 = (struct linux_dirent64 __user *)*dirent;
          					fake_ino = zeromount_generate_ino(dir_path, name_local);
          					if (put_user(fake_ino, &de64->d_ino) || put_user(ZEROMOUNT_MAGIC_POS + v_index + 1, &de64->d_off) || put_user(reclen, &de64->d_reclen) || put_user(type_local, &de64->d_type) || copy_to_user(de64->d_name, name_local, name_len) || put_user(0, de64->d_name + name_len)) break;
          				}
          				*dirent = (void __user *)((char __user *)*dirent + reclen);
          				*count -= reclen;
          				v_index++;
          				*pos = ZEROMOUNT_MAGIC_POS + v_index;
          			}
          			break;
          		}
          		rcu_read_unlock();
          	}
          	__putname(page_buf);
          }

          void zeromount_inject_dents64(struct file *file, void __user **dirent, int *count, loff_t *pos) { zeromount_inject_dents_common(file, dirent, count, pos, 0); }
          void zeromount_inject_dents(struct file *file, void __user **dirent, int *count, loff_t *pos) { zeromount_inject_dents_common(file, dirent, count, pos, 1); }

          #define EROFS_SUPER_MAGIC 0xE0F5E1E2
          int zeromount_spoof_statfs(const char __user *pathname, struct kstatfs *buf)
          {
          	char *kpath, *resolved;
          	int ret = 0;
          	if (zeromount_should_skip() || zeromount_is_uid_blocked(current_uid().val)) return 0;
          #ifdef CONFIG_KSU_SUSFS
          	if (susfs_is_current_proc_umounted()) return 0;
          #endif
          	kpath = strndup_user(pathname, PATH_MAX);
          	if (IS_ERR(kpath)) return 0;
          	resolved = zeromount_resolve_path(kpath);
          	if (!resolved) { kfree(kpath); return 0; }
          	if (strncmp(kpath, "/system", 7) == 0 || strncmp(kpath, "/vendor", 7) == 0 ||
          	    strncmp(kpath, "/product", 8) == 0 || strncmp(kpath, "/odm", 4) == 0) {
          		buf->f_type = EROFS_SUPER_MAGIC;
          		ret = 1;
          	}
          	kfree(kpath);
          	kfree(resolved);
          	return ret;
          }
          EXPORT_SYMBOL(zeromount_spoof_statfs);

          static const char *zeromount_get_selinux_context(const char *vpath)
          {
          	if (!vpath) return NULL;
          	if (strncmp(vpath, "/lib64", 6) == 0 || strncmp(vpath, "/lib", 4) == 0) return "u:object_r:system_lib_file:s0";
          	if (strncmp(vpath, "/bin", 4) == 0) return "u:object_r:system_file:s0";
          	if (strncmp(vpath, "/vendor", 7) == 0) return "u:object_r:vendor_file:s0";
          	if (vpath[0] == '/') return "u:object_r:system_file:s0";
          	return NULL;
          }

          ssize_t zeromount_spoof_xattr(struct dentry *dentry, const char *name, void *value, size_t size)
          {
          	struct inode *inode;
          	char *vpath;
          	const char *context;
          	size_t ctx_len;

          	if (zeromount_should_skip() || zeromount_is_uid_blocked(current_uid().val)) return -EOPNOTSUPP;
          #ifdef CONFIG_KSU_SUSFS
          	if (susfs_is_current_proc_umounted()) return -EOPNOTSUPP;
          #endif
          	if (!dentry || !name || strcmp(name, "security.selinux") != 0) return -EOPNOTSUPP;
          	inode = d_backing_inode(dentry);
          	if (!inode) return -EOPNOTSUPP;
          	vpath = zeromount_get_virtual_path_for_inode(inode);
          	if (!vpath) return -EOPNOTSUPP;
          	context = zeromount_get_selinux_context(vpath);
          	kfree(vpath);
          	if (!context) return -EOPNOTSUPP;
          	ctx_len = strlen(context) + 1;
          	if (size == 0) return ctx_len;
          	if (size < ctx_len) return -ERANGE;
          	memcpy(value, context, ctx_len);
          	return ctx_len;
          }
          EXPORT_SYMBOL(zeromount_spoof_xattr);

          static void zeromount_auto_inject_parent(const char *v_path, unsigned char type, int depth)
          {
          	char *parent_path, *name, *path_copy, *last_slash;
          	struct zeromount_dir_node *dir_node = NULL, *curr;
          	struct zeromount_child_name *child;
          	u32 hash;
          	bool child_exists = false;
          	if (depth > 20) return;
          	{
          		struct path check;
          		if (kern_path(v_path, LOOKUP_FOLLOW, &check) == 0) {
          			path_put(&check);
          			return;
          		}
          	}
          	path_copy = kstrdup(v_path, GFP_KERNEL);
          	if (!path_copy) return;
          	last_slash = strrchr(path_copy, '/');
          	if (!last_slash || last_slash == path_copy) { kfree(path_copy); return; }
          	*last_slash = '\0';
          	parent_path = path_copy;
          	name = last_slash + 1;
          	zeromount_auto_inject_parent(parent_path, DT_DIR, depth + 1);
          	hash = full_name_hash(NULL, parent_path, strlen(parent_path));
          	spin_lock(&zeromount_lock);
          	hash_for_each_possible(zeromount_dirs_ht, curr, node, hash) {
          		if (strcmp(curr->dir_path, parent_path) == 0) { dir_node = curr; break; }
          	}
          	if (!dir_node) {
          		dir_node = kzalloc(sizeof(*dir_node), GFP_ATOMIC);
          		if (!dir_node) goto unlock_out;
          		dir_node->dir_path = kstrdup(parent_path, GFP_ATOMIC);
          		INIT_LIST_HEAD(&dir_node->children_names);
          		hash_add_rcu(zeromount_dirs_ht, &dir_node->node, hash);
          		atomic_inc(&zeromount_dirs_count);
          	}
          	list_for_each_entry(child, &dir_node->children_names, list) {
          		if (strcmp(child->name, name) == 0) { child_exists = true; break; }
          	}
          	if (!child_exists) {
          		child = kzalloc(sizeof(*child), GFP_ATOMIC);
          		if (child) {
          			child->name = kstrdup(name, GFP_ATOMIC);
          			child->d_type = (type == DT_DIR) ? 4 : 8;
          			list_add_tail_rcu(&child->list, &dir_node->children_names);
          		}
          	}
          unlock_out:
          	spin_lock(&zeromount_lock);
          	kfree(path_copy);
          }

          static int zeromount_ioctl_add_rule(unsigned long arg)
          {
          	struct zeromount_ioctl_data data;
          	struct zeromount_rule *rule;
          	char *v_path_raw, *v_path, *r_path;
          	struct path path;
          	unsigned char type;
          	u32 hash;
          	if (copy_from_user(&data, (void __user *)arg, sizeof(data))) return -EFAULT;
          	v_path_raw = strndup_user(data.virtual_path, PATH_MAX);
          	if (IS_ERR(v_path_raw)) return PTR_ERR(v_path_raw);
          	v_path = zeromount_normalize_path(v_path_raw);
          	kfree(v_path_raw);
          	if (!v_path) return -ENOMEM;
          	r_path = strndup_user(data.real_path, PATH_MAX);
          	if (IS_ERR(r_path)) { kfree(v_path); return PTR_ERR(r_path); }

          	hash = full_name_hash(NULL, v_path, strlen(v_path));
          	rule = kzalloc(sizeof(*rule), GFP_KERNEL);
          	if (!rule) { kfree(v_path); kfree(r_path); return -ENOMEM; }

          	rule->virtual_path = v_path;
          	rule->vp_len = strlen(v_path);
          	rule->real_path = r_path;
          	rule->flags = data.flags | ZM_FLAG_ACTIVE;
          	rule->is_new = false;
          	if (zm_ino_adb == 0) zeromount_refresh_critical_inodes();

          	if (kern_path(r_path, LOOKUP_FOLLOW, &path) == 0) {
          		struct inode *inode = d_backing_inode(path.dentry);
          		if (inode) {
          			rule->real_ino = inode->i_ino;
          			rule->real_dev = inode->i_sb->s_dev;
          		}
          		path_put(&path);
          	}
          	zm_enter();
          	if (kern_path(v_path, LOOKUP_FOLLOW, &path) == 0) {
          		struct inode *vinode = d_backing_inode(path.dentry);
          		if (vinode) {
          			rule->v_ino = vinode->i_ino;
          			rule->v_dev = vinode->i_sb->s_dev;
          		}
          		path_put(&path);
          	}
          	zm_exit();
          	if (rule->v_ino == 0) rule->v_ino = zeromount_generate_ino(v_path, r_path);

          	spin_lock(&zeromount_lock);
          	hash_add_rcu(zeromount_rules_ht, &rule->node, hash);
          	zm_bloom_add(hash);
          	if (rule->real_ino != 0) {
          		unsigned long ino_key = rule->real_ino ^ rule->real_dev;
          		hash_add_rcu(zeromount_ino_ht, &rule->ino_node, ino_key);
          	}
          	list_add_tail(&rule->list, &zeromount_rules_list);
          	atomic_inc(&zeromount_rule_count);
          	spin_unlock(&zeromount_lock);

          	type = (data.flags & ZM_FLAG_IS_DIR) ? DT_DIR : DT_REG;
          	if (kern_path(rule->virtual_path, LOOKUP_FOLLOW, &path) == 0) {
          		path_put(&path);
          	} else {
          		zeromount_auto_inject_parent(rule->virtual_path, type, 0);
          		WRITE_ONCE(rule->is_new, true);
          	}
          	zeromount_flush_dcache(rule->virtual_path);
          	return 0;
          }

          static int zeromount_ioctl_del_rule(unsigned long arg)
          {
          	struct zeromount_ioctl_data data;
          	struct zeromount_rule *rule = NULL;
          	struct hlist_node *tmp;
          	char *v_path_raw, *v_path;
          	int bkt;
          	bool found = false;
          	if (copy_from_user(&data, (void __user *)arg, sizeof(data))) return -EFAULT;
          	v_path_raw = strndup_user(data.virtual_path, PATH_MAX);
          	if (IS_ERR(v_path_raw)) return PTR_ERR(v_path_raw);
          	v_path = zeromount_normalize_path(v_path_raw);
          	kfree(v_path_raw);
          	if (!v_path) return -ENOMEM;
          	spin_lock(&zeromount_lock);
          	hash_for_each_safe(zeromount_rules_ht, bkt, tmp, rule, node) {
          		if (strcmp(rule->virtual_path, v_path) == 0) {
          			hash_del_rcu(&rule->node);
          			if (rule->real_ino != 0) hash_del_rcu(&rule->ino_node);
          			list_del(&rule->list);
          			found = true;
          			break;
          		}
          	}
          	if (found) atomic_dec(&zeromount_rule_count);
          	zm_bloom_rebuild();
          	spin_unlock(&zeromount_lock);
          	if (found && rule) call_rcu(&rule->rcu, zeromount_free_rule_rcu);
          	kfree(v_path);
          	return found ? 0 : -ENOENT;
          }

          static int zeromount_ioctl_clear_rules(void)
          {
          	struct zeromount_rule *rule;
          	struct zeromount_uid_node *uid_node;
          	struct hlist_node *tmp;
          	int bkt;
          	spin_lock(&zeromount_lock);
          	hash_for_each_safe(zeromount_rules_ht, bkt, tmp, rule, node) {
          		hash_del_rcu(&rule->node);
          		if (rule->real_ino != 0) hash_del_rcu(&rule->ino_node);
          		list_del(&rule->list);
          		call_rcu(&rule->rcu, zeromount_free_rule_rcu);
          	}
          	hash_for_each_safe(zeromount_uid_ht, bkt, tmp, uid_node, node) {
          		hash_del_rcu(&uid_node->node);
          		kfree_rcu(uid_node, rcu);
          	}
          	atomic_set(&zeromount_rule_count, 0);
          	bitmap_zero(zm_bloom, ZM_BLOOM_BITS);
          	spin_unlock(&zeromount_lock);
          	return 0;
          }

          static int zeromount_ioctl_list_rules(unsigned long arg)
          {
          	struct zeromount_rule *rule;
          	char *kbuf;
          	int ret = 0;
          	size_t len = 0, remaining;
          	char __user *ubuf = (char __user *)arg;
          	kbuf = vmalloc(MAX_LIST_BUFFER_SIZE);
          	if (!kbuf) return -ENOMEM;
          	memset(kbuf, 0, MAX_LIST_BUFFER_SIZE);
          	spin_lock(&zeromount_lock);
          	list_for_each_entry(rule, &zeromount_rules_list, list) {
          		remaining = MAX_LIST_BUFFER_SIZE - len;
          		if (remaining <= 1) { ret = -ENOBUFS; break; }
          		len += scnprintf(kbuf + len, remaining, "%s->%s\n", rule->real_path, rule->virtual_path);
          	}
          	spin_unlock(&zeromount_lock);
          	if (ret == -ENOBUFS) { vfree(kbuf); return ret; }
          	if (copy_to_user(ubuf, kbuf, len)) ret = -EFAULT; else ret = len;
          	vfree(kbuf);
          	return ret;
          }

          static int zeromount_ioctl_add_uid(unsigned long arg)
          {
          	unsigned int uid;
          	struct zeromount_uid_node *entry;
          	if (copy_from_user(&uid, (void __user *)arg, sizeof(uid))) return -EFAULT;
          	if (zeromount_is_uid_blocked(uid)) return -EEXIST;
          	entry = kzalloc(sizeof(*entry), GFP_KERNEL);
          	if (!entry) return -ENOMEM;
          	entry->uid = uid;
          	spin_lock(&zeromount_lock);
          	hash_add_rcu(zeromount_uid_ht, &entry->node, uid);
          	spin_unlock(&zeromount_lock);
          	return 0;
          }

          static int zeromount_ioctl_del_uid(unsigned long arg)
          {
          	unsigned int uid;
          	struct zeromount_uid_node *entry;
          	struct hlist_node *tmp;
          	int bkt;
          	bool found = false;
          	if (copy_from_user(&uid, (void __user *)arg, sizeof(uid))) return -EFAULT;
          	spin_lock(&zeromount_lock);
          	hash_for_each_safe(zeromount_uid_ht, bkt, tmp, entry, node) {
          		if (entry->uid == uid) { hash_del_rcu(&entry->node); found = true; break; }
          	}
          	spin_unlock(&zeromount_lock);
          	if (found && entry) kfree_rcu(entry, rcu);
          	return found ? 0 : -ENOENT;
          }

          static long zeromount_ioctl(struct file *filp, unsigned int cmd, unsigned long arg)
          {
          	if (_IOC_TYPE(cmd) != ZEROMOUNT_MAGIC_CODE) return -ENOTTY;
          	if (cmd != ZEROMOUNT_IOC_GET_VERSION && !capable(CAP_SYS_ADMIN)) return -EPERM;
          	switch (cmd) {
          	case ZEROMOUNT_IOC_GET_VERSION:	return ZEROMOUNT_VERSION;
          	case ZEROMOUNT_IOC_ADD_RULE:	return zeromount_ioctl_add_rule(arg);
          	case ZEROMOUNT_IOC_DEL_RULE:	return zeromount_ioctl_del_rule(arg);
          	case ZEROMOUNT_IOC_CLEAR_ALL:	return zeromount_ioctl_clear_rules();
          	case ZEROMOUNT_IOC_ADD_UID:	return zeromount_ioctl_add_uid(arg);
          	case ZEROMOUNT_IOC_DEL_UID:	return zeromount_ioctl_del_uid(arg);
          	case ZEROMOUNT_IOC_GET_LIST:	return zeromount_ioctl_list_rules(arg);
          	case ZEROMOUNT_IOC_ENABLE:	atomic_set(&zeromount_enabled, 1); return 0;
          	case ZEROMOUNT_IOC_DISABLE:	atomic_set(&zeromount_enabled, 0); return 0;
          	case ZEROMOUNT_IOC_REFRESH:	zeromount_force_refresh_all(); return 0;
          	case ZEROMOUNT_IOC_GET_STATUS:	return atomic_read(&zeromount_enabled);
          	default:			return -EINVAL;
          	}
          }

          static int zeromount_dev_open(struct inode *inode, struct file *file) {
          	if (!uid_eq(current_euid(), GLOBAL_ROOT_UID)) return -EPERM;
          	return 0;
          }

          static const struct file_operations zeromount_fops = {
          	.owner		= THIS_MODULE,
          	.open		= zeromount_dev_open,
          	.unlocked_ioctl	= zeromount_ioctl,
          #ifdef CONFIG_COMPAT
          	.compat_ioctl	= zeromount_ioctl,
          #endif
          };

          static struct miscdevice zeromount_device = {
          	.minor	= MISC_DYNAMIC_MINOR,
          	.name	= "zeromount",
          	.fops	= &zeromount_fops,
          	.mode	= 0600,
          };

          static int __init __used zeromount_init(void) {
          	spin_lock_init(&zeromount_lock);
          	return misc_register(&zeromount_device);
          }
          fs_initcall(zeromount_init);
          EOF_ZM_C

      - name: AST ENGINE - Spatch & Tree-Sitter Strict Hooks Injection 
        run: |
          cd work/common

          echo "Generating Semantic .cocci definitions..."
          cat << 'EOF_COCCI' > fs/zm.cocci
          @d_path_rule@
          identifier path, buf, buflen;
          @@
           char *d_path(const struct path *path, char *buf, int buflen) {
          + #ifdef CONFIG_ZEROMOUNT
          + if (path->dentry && d_backing_inode(path->dentry)) {
          +   char *v_path = zeromount_get_static_vpath(d_backing_inode(path->dentry));
          +   if (v_path) {
          +       int len = strlen(v_path);
          +       if (buflen < len + 1) {
          +           kfree(v_path);
          +           return ERR_PTR(-ENAMETOOLONG);
          +       }
          +       char *res = buf + buflen;
          +       *--res = '\0';
          +       res -= len;
          +       memcpy(res, v_path, len);
          +       kfree(v_path);
          +       return res;
          +   }
          + }
          + #endif
          ...
          }

          @namei_rule_1@
          identifier result;
          @@
           audit_getname(result);
          + #ifdef CONFIG_ZEROMOUNT
          + if (!IS_ERR(result)) result = zeromount_getname_hook(result);
          + #endif
          return result;

          @namei_rule_2@
          identifier inode, mask;
          @@
          int generic_permission(struct inode *inode, int mask) {
          +#ifdef CONFIG_ZEROMOUNT
          +if (zeromount_is_injected_file(inode)) {
          +    if (mask & MAY_WRITE) return -EACCES;
          +    return 0;
          +}
          +if (S_ISDIR(inode->i_mode) && zeromount_is_traversal_allowed(inode, mask)) return 0;
          +#endif
          ...
          }

          @namei_rule_3@
          identifier inode, mask;
          @@
          int inode_permission(struct inode *inode, int mask) {
          +#ifdef CONFIG_ZEROMOUNT
          +if (zeromount_is_injected_file(inode)) {
          +    if (mask & MAY_WRITE) return -EACCES;
          +    return 0;
          +}
          +if (S_ISDIR(inode->i_mode) && zeromount_is_traversal_allowed(inode, mask)) return 0;
          +#endif
          ...
          }

          @statfs_rule@
          identifier st;
          identifier path;
          @@
          vfs_statfs(..., struct kstatfs *st) {
          ...
            error = statfs_by_dentry(...);
          +#ifdef CONFIG_ZEROMOUNT
          + (void)zeromount_spoof_statfs(pathname, st);
          +#endif
          ...
          }
          EOF_COCCI

          echo "Applying Coccinelle Syntax Operations (Safe Spatch)..."
          spatch --sp-file fs/zm.cocci fs/d_path.c --in-place
          spatch --sp-file fs/zm.cocci fs/namei.c --in-place

          echo "Injecting Kconfig..."
          cat << 'EOF' > patch_kconfig.py
          import os
          content = open("fs/Kconfig", "r").read()
          content = content.replace('endmenu', 'config ZEROMOUNT\n\tbool "ZeroMount"\n\tdefault y\n\nendmenu')
          open("fs/Kconfig", "w").write(content)
          with open("fs/Makefile", "a") as f:
              f.write("\nobj-$(CONFIG_ZEROMOUNT) += zeromount.o\n")
          EOF
          python3 patch_kconfig.py
          
          echo "Executing AST verification and fix logic on readdir.c..."
          python3 - << 'EOF_TREE'
          import sys
          with open('fs/readdir.c', 'r') as f: code = f.read()
          
          if '#include <linux/zeromount.h>' not in code:
              code = code.replace('#include <linux/unistd.h>', '#include <linux/unistd.h>\n#ifdef CONFIG_ZEROMOUNT\n#include <linux/zeromount.h>\n#endif\n')

          orig = """\terror = iterate_dir(f.file, &buf.ctx);
          \tif (error >= 0)
          \t\terror = buf.error;
          \tif (buf.prev_reclen) {
          \t\tstruct linux_dirent64 __user * lastdirent;
          \t\ttypeof(lastdirent->d_off) d_off = buf.ctx.pos;

          \t\tlastdirent = (void __user *) buf.current_dir - buf.prev_reclen;
          \t\tif (put_user(d_off, &lastdirent->d_off))
          \t\t\terror = -EFAULT;
          \t\telse
          \t\t\terror = count - buf.count;
          \t}
          \tfdput_pos(f);
          \treturn error;"""

          target = """#ifdef CONFIG_ZEROMOUNT
          \tif (f.file->f_pos >= ZEROMOUNT_MAGIC_POS) {
          \t\terror = 0;
          \t\tgoto zm_skip_real64;
          \t}
          #endif
          \terror = iterate_dir(f.file, &buf.ctx);
          \tif (error >= 0)
          \t\terror = buf.error;
          \tif (buf.prev_reclen) {
          \t\tstruct linux_dirent64 __user * lastdirent;
          \t\ttypeof(lastdirent->d_off) d_off = buf.ctx.pos;

          \t\tlastdirent = (void __user *) buf.current_dir - buf.prev_reclen;
          \t\tif (put_user(d_off, &lastdirent->d_off))
          \t\t\terror = -EFAULT;
          \t\telse
          \t\t\terror = count - buf.count;
          \t}
          #ifdef CONFIG_ZEROMOUNT
          zm_skip_real64:
          \tif (error >= 0 && !signal_pending(current)) {
          \t\tint pre_count = count;
          \t\tzeromount_inject_dents64(f.file, (void __user **)&dirent, (int *)&count, &f.file->f_pos);
          \t\tif (count != pre_count) {
          \t\t\tif (error < 0) error = 0;
          \t\t\terror += (pre_count - count);
          \t\t}
          \t}
          #endif
          \tfdput_pos(f);
          \treturn error;"""

          if orig not in code:
              print("ERROR: AST Structure constraint failed for readdir.c!")
              sys.exit(1)
              
          code = code.replace(orig, target)
          with open('fs/readdir.c', 'w') as f: f.write(code)
          EOF_TREE
          
          echo "Writing Process Memory Verification Overrides..."
          python3 - << 'EOF_PROC'
          import sys, os, re
          if os.path.exists("fs/proc/array.c"):
              with open('fs/proc/array.c', 'r') as f: a = f.read()
              a = a.replace('#include <linux/fs_struct.h>', '#include <linux/fs_struct.h>\n#include <linux/cred.h>')
              t1 = 'seq_puts(m, "State:\\t");\n\tseq_puts(m, get_task_state(p));'
              r1 = 'seq_puts(m, "State:\\t");\n\tif (__kuid_val(current_uid()) >= 10000 && (*get_task_state(p) == \'t\' || *get_task_state(p) == \'T\'))\n\t\tseq_puts(m, "S (sleeping)");\n\telse\n\t\tseq_puts(m, get_task_state(p));'
              a = a.replace(t1, r1)
              with open('fs/proc/array.c', 'w') as f: f.write(a)

          cmd_path = "fs/proc/cmdline.c"
          if os.path.exists(cmd_path):
              with open(cmd_path, "r") as f: content = f.read()
              hlp = """#include <linux/slab.h>\n#include <linux/string.h>\n#include <linux/cred.h>\nstatic void replace_str(char *b, size_t max, const char *s, const char *r) {\n\tchar *p=b; size_t sl=strlen(s), rl=strlen(r);\n\twhile((p=strstr(p,s))!=NULL) {\n\t\tif (rl>sl && strlen(b)+(rl-sl)>=max) break;\n\t\tif (rl!=sl) memmove(p+rl, p+sl, strlen(p+sl)+1);\n\t\tmemcpy(p, r, rl); p+=rl;\n\t}\n}\n"""
              func = """static int cmdline_proc_show(struct seq_file *m, void *v) {
              \tchar *buf; size_t len;
              \tif (!saved_command_line) { seq_putc(m, 10); return 0; }
              \tif (__kuid_val(current_uid()) >= 10000) {
              \t\tlen = strlen(saved_command_line); buf = kzalloc(len + 256, GFP_KERNEL);
              \t\tif (buf) {
              \t\t\tmemcpy(buf, saved_command_line, len + 1);
              \t\t\treplace_str(buf, len + 256, "androidboot.verifiedbootstate=orange", "androidboot.verifiedbootstate=green");
              \t\t\tseq_puts(m, buf); kfree(buf); seq_putc(m, 10); return 0;
              \t\t}
              \t}
              \tseq_puts(m, saved_command_line); seq_putc(m, 10); return 0;
              }"""
              pat = r'static int cmdline_proc_show\(struct seq_file \*m, void \*v\)\s*\{.*?\n\}'
              content = hlp + re.sub(pat, func, content, flags=re.DOTALL)
              with open(cmd_path, "w") as f: f.write(content)
          EOF_PROC

      - name: KernelSU Setup and System Defconfig Override
        run: |
          cd work/common
          curl -LSs "https://raw.githubusercontent.com/pershoot/KernelSU-Next/refs/heads/dev-susfs/kernel/setup.sh" | bash -s dev-susfs
          
          sed -i 's/CONFIG_KSU=m/CONFIG_KSU=y/g' arch/arm64/configs/gki_defconfig || true
          cat << 'EOF_CONFIGS' >> arch/arm64/configs/gki_defconfig
          CONFIG_KSU=y
          CONFIG_KSU_NEXT=y
          CONFIG_OVERLAY_FS=y
          CONFIG_KPROBES=y
          CONFIG_HAVE_KPROBES=y
          CONFIG_KPROBE_EVENTS=y
          CONFIG_ZEROMOUNT=y
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT_REDIRECT=y
          CONFIG_KSU_SUSFS_SUS_OVERLAYFS=y
          CONFIG_KSU_SUSFS_TRY_UMOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT=y
          CONFIG_KSU_SUSFS_SPOOF_UNAME=y
          CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y
          CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
          CONFIG_KSU_SUSFS_SUS_SU=y
          CONFIG_KSU_SUSFS_ENABLE_LOG=n
          EOF_CONFIGS

          echo "Bypassing Legacy API Incompatibilities"
          grep -rl "timer_delete_sync" drivers/ fs/ kernel/ net/ include/ 2>/dev/null | xargs sed -i 's/timer_delete_sync/del_timer_sync/g' 2>/dev/null || true

      - name: PRE-FLIGHT COMPILE (Strict Logic Guard)
        run: |
          cd work/common
          export ARCH=arm64
          export LLVM=1
          make ARCH=arm64 gki_defconfig
          echo "Compiling Modified Hooks with Native Parser..."
          make -j$(nproc) ARCH=arm64 fs/d_path.o fs/namei.o fs/readdir.o fs/zeromount.o fs/proc/array.o
          echo "🎉 Pre-flight strictly verified. Zero syntax regressions detected."

      - name: Build kernel
        run: |
          cd work/common
          chmod +x ./build-kernel.sh
          ./build-kernel.sh ${{ inputs.ccache && '--ccache' || '' }}

      - name: Save ccache cache
        if: ${{ inputs.ccache && always() }}
        uses: actions/cache/save@v4
        with:
          path: work/.ccache
          key: cfx-ccache-${{ env.CLANG_ASSET }}-${{ inputs.kernel_repo }}-${{ inputs.kernel_branch }}-${{ github.run_id }}

      - name: Publish release
        if: ${{ inputs.publish_release }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$RELEASE_TAG"
          if [ -z "$tag" ]; then
            tag="kernel-$(date -u +%Y%m%d-%H%M)"
          fi
          
          cd "$GITHUB_WORKSPACE/work/dist"
          pkg="$GITHUB_WORKSPACE/work/pkg"
          mkdir -p "$pkg"
          assets=()
          for f in Image Image.lz4 Image.gz vmlinux System.map ikconfig .config; do
            [ -f "$f" ] && assets+=("$f")
          done
          tar -I 'zstd -T0' -cf "$pkg/kernel-dist.tar.zst" .
          assets+=("$pkg/kernel-dist.tar.zst")
          
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" --clobber "${assets[@]}"
          else
            gh release create "$tag" \
              --title "Templar Kernel GKI $tag" \
              --notes "Engineered via C-AST Compiler. Zero Diff-Guessing, Zero Corruption." \
              "${assets[@]}"
          fi
