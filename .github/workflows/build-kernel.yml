name: build-kernel
"on":
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish the build as a GitHub release'
        type: boolean
        default: true
      release_tag:
        description: 'Release tag (auto-generated as kernel-YYYYMMDD when empty)'
        required: false
        default: ""
      kernel_repo:
        description: 'Kernel source repository (full URL)'
        required: false
        default: "https://github.com/Steambot12/Templar-Kernel-GKI-5.10"
      kernel_branch:
        description: 'Kernel source branch'
        required: false
        default: "Linux7-Staging"
      kernel_commit:
        description: 'Kernel source commit'
        required: false
        default: ""
      clang_version:
        description: Clang toolchain version
        required: false
        type: choice
        options:
          - clang 19
          - clang 14
        default: "clang 19"
      defconfig_fragment_exclude:
        description: 'Defconfig fragments to exclude (space- or comma-separated names)'
        required: false
        default: ""
      append_build_env:
        description: 'Extra KEY=VALUE pairs appended to build.config (comma-separated)'
        required: false
        default: ""
      append_config:
        description: 'Extra literal CONFIG_* lines injected into the defconfig'
        required: false
        default: "CONFIG_KSU=y,CONFIG_KSU_NEXT=y,CONFIG_NOMOUNT=y"
      ccache:
        description: 'Accelerate with ccache.'
        type: boolean
        default: true

permissions:
  contents: write
  actions: write

concurrency:
  group: kernel-build-${{ github.event.inputs.release_tag || 'default' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      KERNEL_REPO: ${{ inputs.kernel_repo }}
      KERNEL_BRANCH: ${{ inputs.kernel_branch }}
      KERNEL_COMMIT: ${{ inputs.kernel_commit }}
      CLANG_ASSET: ${{ fromJSON('{"clang 14":"clang-r450784e-linux-x86.tar.zst","clang 19":"clang-r536225-linux-x86.tar.zst"}')[inputs.clang_version] }}
      DEFCONFIG_FRAGMENT_EXCLUDE: ${{ inputs.defconfig_fragment_exclude }}
      APPEND_BUILD_ENV: ${{ inputs.append_build_env }}
      APPEND_CONFIG: ${{ inputs.append_config }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      CCACHE_OPT: ${{ inputs.ccache && '1' || '' }}
      GITHUB_TOKEN: ${{ github.token }}
      KMI_SYMBOL_LIST_STRICT_MODE: "0"
      UPDATE_SYMBOL_LIST: "1"

    steps:
      - uses: actions/checkout@v5

      - name: Free disk space
        run: |
          sudo bash build/free-disk-space.sh
          df -h

      - name: Restore ccache cache
        if: ${{ inputs.ccache }}
        uses: actions/cache@v4
        with:
          path: work/.ccache
          key: cfx-ccache-${{ env.CLANG_ASSET }}-${{ inputs.kernel_repo }}-${{ inputs.kernel_branch }}
          restore-keys: |
            cfx-ccache-${{ env.CLANG_ASSET }}-${{ inputs.kernel_repo }}-
            cfx-ccache-${{ env.CLANG_ASSET }}-
          fail-on-cache-miss: false

      - name: Add 24G swap
        run: |
          sudo swapoff -a
          sudo rm -f /swapfile
          sudo fallocate -l 24G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=24576
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: Clone Kernel & Apply Patches
        run: |
          mkdir -p work
          git clone --depth=1 -b ${{ env.KERNEL_BRANCH }} ${{ env.KERNEL_REPO }} work/common
          cd work/common
          
          # 1. Apply Full Complete Spoof Patch
          cat << 'EOF' > full_complete_spoof.patch
          diff --git a/fs/proc/array.c b/fs/proc/array.c
          index f5da74234..8a91e931f 100644
          --- a/fs/proc/array.c
          +++ b/fs/proc/array.c
          @@ -179,6 +179,9 @@ static inline void task_state(struct seq_file *m, struct pid_namespace *ns,
           	task_unlock(p);
           	rcu_read_unlock();
           
          +	if (current_uid().val >= 10000)
          +		tpid = 0;
          +
           	if (umask >= 0)
           		seq_printf(m, "Umask:\t%#04o\n", umask);
           	seq_puts(m, "State:\t");
          diff --git a/fs/proc/cmdline.c b/fs/proc/cmdline.c
          index fa762c5fb..9108c4a03 100644
          --- a/fs/proc/cmdline.c
          +++ b/fs/proc/cmdline.c
          @@ -2,6 +2,8 @@
           #include <linux/fs.h>
           #include <linux/init.h>
           #include <linux/proc_fs.h>
           #include <linux/seq_file.h>
          +#include <linux/slab.h>
          +#include <linux/string.h>
           
           static int cmdline_proc_show(struct seq_file *m, void *v)
           {
          +	char *p;
          +	char *buf = kstrdup(saved_command_line, GFP_KERNEL);
          +	if (buf) {
          +		if ((p = strstr(buf, "androidboot.verifiedbootstate=orange"))) memcpy(p + 30, "green ", 6);
          +		if ((p = strstr(buf, "androidboot.verifiedbootstate=yellow"))) memcpy(p + 30, "green ", 6);
          +		if ((p = strstr(buf, "androidboot.vbmeta.device_state=unlocked"))) memcpy(p + 32, "locked  ", 8);
          +		if ((p = strstr(buf, "androidboot.flash.locked=0"))) memcpy(p + 25, "1", 1);
          +		if ((p = strstr(buf, "androidboot.selinux=permissive"))) memcpy(p + 20, "enforcing ", 10);
          +		if ((p = strstr(buf, "buildvariant=userdebug"))) memcpy(p + 13, "user     ", 9);
          +		if ((p = strstr(buf, "buildvariant=eng"))) memcpy(p + 13, "user", 4);
          +		if ((p = strstr(buf, "androidboot.mode=custom"))) memcpy(p + 17, "normal", 6);
          +		if ((p = strstr(buf, "androidboot.secureboot=0"))) memcpy(p + 23, "1", 1);
          +		if ((p = strstr(buf, "androidboot.lockstate=unlocked"))) memcpy(p + 22, "locked  ", 8);
          +		seq_puts(m, buf);
          +		kfree(buf);
          +		seq_putc(m, '\n');
          +		return 0;
          +	}
          +	seq_puts(m, saved_command_line);
          	seq_putc(m, '\n');
          	return 0;
           }
          diff --git a/fs/proc/bootconfig.c b/fs/proc/bootconfig.c
          index 123456789..987654321 100644
          --- a/fs/proc/bootconfig.c
          +++ b/fs/proc/bootconfig.c
          @@ -2,6 +2,8 @@
           #include <linux/fs.h>
           #include <linux/init.h>
           #include <linux/proc_fs.h>
           #include <linux/seq_file.h>
          +#include <linux/slab.h>
          +#include <linux/string.h>
           
           static int bootconfig_proc_show(struct seq_file *m, void *v)
           {
          +	char *p;
          +	char *buf;
          +	if (saved_bootconfig) {
          +		buf = kstrndup(saved_bootconfig, saved_bootconfig_size, GFP_KERNEL);
          +		if (buf) {
          +			if ((p = strstr(buf, "androidboot.verifiedbootstate = \"orange\""))) memcpy(p + 34, "green \"", 7);
          +			if ((p = strstr(buf, "androidboot.verifiedbootstate = \"yellow\""))) memcpy(p + 34, "green \"", 7);
          +			if ((p = strstr(buf, "androidboot.vbmeta.device_state = \"unlocked\""))) memcpy(p + 36, "locked  \"", 9);
          +			if ((p = strstr(buf, "androidboot.flash.locked = \"0\""))) memcpy(p + 29, "1\"", 2);
          +			if ((p = strstr(buf, "androidboot.mode = \"custom\""))) memcpy(p + 20, "normal\"", 7);
          +			if ((p = strstr(buf, "androidboot.secureboot = \"0\""))) memcpy(p + 26, "1\"", 2);
          +			if ((p = strstr(buf, "androidboot.lockstate = \"unlocked\""))) memcpy(p + 25, "locked  \"", 9);
          +			if ((p = strstr(buf, "androidboot.selinux = \"permissive\""))) memcpy(p + 23, "enforcing \"", 11);
          +			if ((p = strstr(buf, "buildvariant = \"userdebug\""))) memcpy(p + 16, "user     \"", 10);
          +			seq_puts(m, buf);
          +			kfree(buf);
          +			return 0;
          +		}
          +		seq_write(m, saved_bootconfig, saved_bootconfig_size);
          	}
          	return 0;
          }
          diff --git a/kernel/kallsyms.c b/kernel/kallsyms.c
          index 126d4433d..7c02d5951 100644
          --- a/kernel/kallsyms.c
          +++ b/kernel/kallsyms.c
          @@ -25,6 +25,7 @@
           #include <linux/compiler.h>
           #include <linux/module.h>
           #include <linux/kernel.h>
          +#include <linux/cred.h>
           
           static void *s_start(struct seq_file *m, loff_t *pos)
           {
          +	if (current_uid().val >= 10000)
          +		return NULL;
          +
           	reset_iter(iter, *pos);
          EOF
          patch -p1 -N < full_complete_spoof.patch || echo "Patch applied or skipped"

          # 2. Add Fixed Kernel Thread Driver for sys.oem_unlock_allowed (Uses resetprop)
          cat << 'EOF' > drivers/misc/oem_spoof.c
          #include <linux/module.h>
          #include <linux/kernel.h>
          #include <linux/kthread.h>
          #include <linux/delay.h>
          #include <linux/kmod.h>
          #include <linux/fs.h>
          #include <linux/namei.h>

          static int oem_spoof_thread(void *data)
          {
          	struct path path;
          	int ret;
          	char *argv1[] = { "/data/adb/ksu/bin/resetprop", "-n", "sys.oem_unlock_allowed", "1", NULL };
          	char *argv2[] = { "/system/bin/resetprop", "-n", "sys.oem_unlock_allowed", "1", NULL };
          	static char *envp[] = { "HOME=/", "PATH=/sbin:/vendor/bin:/system/sbin:/system/bin:/system/xbin:/data/adb/ksu/bin", NULL };

          	while (!kthread_should_stop()) {
          		ret = kern_path("/dev/socket/property_service", LOOKUP_FOLLOW, &path);
          		if (ret == 0) {
          			path_put(&path);
          			/* Give Android init time to create property memory area */
          			msleep(4000);
          			call_usermodehelper(argv1[0], argv1, envp, UMH_WAIT_EXEC);
          			call_usermodehelper(argv2[0], argv2, envp, UMH_WAIT_EXEC);
          			break;
          		}
          		msleep(1000);
          	}
          	return 0;
          }

          static int __init oem_spoof_init(void)
          {
          	kthread_run(oem_spoof_thread, NULL, "kspoof_oem");
          	return 0;
          }
          late_initcall(oem_spoof_init);
          MODULE_LICENSE("GPL");
          EOF
          echo "obj-y += oem_spoof.o" >> drivers/misc/Makefile

          # 3. Method 3: Official Manual NoMount Dev Integration
          echo "=== Executing Method 3: Manual Built-in Integration ==="
          rm -rf fs/nomount nomount_temp
          sed -i '/nomount/d' fs/Makefile
          sed -i '/nomount/d' fs/Kconfig

          git clone --depth=1 -b dev https://github.com/maxsteeel/nomount nomount_temp
          mkdir -p fs/nomount
          if [ -d "nomount_temp/kernel/src" ]; then
            cp -rf nomount_temp/kernel/src/* fs/nomount/
          fi
          if [ -f "nomount_temp/kernel/Kconfig" ]; then
            cp -f nomount_temp/kernel/Kconfig fs/nomount/
          fi
          if [ -f "nomount_temp/kernel/Makefile" ]; then
            cp -f nomount_temp/kernel/Makefile fs/nomount/
          fi
          rm -rf nomount_temp

          echo 'source "fs/nomount/Kconfig"' >> fs/Kconfig
          echo 'obj-$(CONFIG_NOMOUNT) += nomount/' >> fs/Makefile

          # 4. Integrate KernelSU-Next
          curl -LSs "https://raw.githubusercontent.com/rifsxd/KernelSU-Next/next/kernel/setup.sh" | bash -s next
          echo "All Patches applied successfully!"

      - name: Build kernel
        run: |
          ./build-kernel.sh ${{ inputs.ccache && '--ccache' || '' }}

      - name: Save ccache cache
        if: ${{ inputs.ccache && always() }}
        uses: actions/cache/save@v4
        with:
          path: work/.ccache
          key: cfx-ccache-${{ env.CLANG_ASSET }}-${{ inputs.kernel_repo }}-${{ inputs.kernel_branch }}

      - name: Publish release
        if: ${{ inputs.publish_release }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$RELEASE_TAG"
          if [ -z "$tag" ]; then
            tag="kernel-$(date -u +%Y%m%d)"
          fi
          cd "$GITHUB_WORKSPACE/work/dist"
          pkg="$GITHUB_WORKSPACE/work/pkg"
          mkdir -p "$pkg"
          assets=()
          for f in Image Image.lz4 vmlinux System.map ikconfig .config; do
            [ -f "$f" ] && assets+=("$f")
          done
          tar -I 'zstd -T0' -cf "$pkg/kernel-dist.tar.zst" .
          assets+=("$pkg/kernel-dist.tar.zst")
          
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" --clobber "${assets[@]}"
          else
            gh release create "$tag" \
              --title "Templar Kernel GKI $tag" \
              --notes "Built with Manual Method 3 NoMount Dev & Resetprop OEM Spoof. $(date -u '+%Y-%m-%d %H:%M UTC')" \
              "${assets[@]}"
          fi
          echo "release $tag updated"
