name: merge-lts

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      strategy:
        description: "merge|cherry-pick"
        required: false
        default: "merge"
        type: choice
        options: [merge, cherry-pick]
      dry_run:
        description: "dry run without push"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: merge-lts
  cancel-in-progress: false

jobs:
  merge:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Kernel (cross-repo)
        uses: actions/checkout@v5
        with:
          repository: Chor-A/Templar-Kernel-GKI-5.10
          ref: Linux7-Staging
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 1
          filter: blob:none

      - name: Configure git
        run: |
          git config user.name "Chor-A"
          git config user.email "Antonio_Nelson@proton.me"
          git config commit.gpgsign false
          git config tag.gpgsign false
          git config rerere.enabled true

      - name: Add remotes and fetch deterministic
        run: |
          max_depth=10000
          init_depth=100
          step=500
          git remote add google https://android.googlesource.com/kernel/common || git remote set-url google https://android.googlesource.com/kernel/common
          git fetch --depth="$init_depth" --filter=blob:none origin Linux7-Staging
          git fetch --depth="$init_depth" --filter=blob:none google android12-5.10-lts
          cur="$init_depth"
          while ! git merge-base HEAD google/android12-5.10-lts >/dev/null 2>&1; do
            if [ "$cur" -ge "$max_depth" ]; then
              git fetch --unshallow --filter=blob:none origin Linux7-Staging 2>&1 || true
              git fetch --unshallow --filter=blob:none google android12-5.10-lts 2>&1 || true
              break
            fi
            cur=$((cur + step))
            git fetch --deepen="$step" origin Linux7-Staging 2>&1 || true
            for i in 1 2 3; do git fetch --deepen="$step" google android12-5.10-lts 2>&1 && break || sleep 5; done || true
          done
          if [ "${{ inputs.strategy || 'merge' }}" = "merge" ] && [ -f .git/shallow ]; then
            git fetch --unshallow --filter=blob:none origin Linux7-Staging 2>&1 || true
            for i in 1 2 3; do git fetch --unshallow --filter=blob:none google android12-5.10-lts 2>&1 && break || sleep 5; done || true
          fi

      - name: Check if new LTS commits
        id: check
        run: |
          new=$(git rev-list --count HEAD..google/android12-5.10-lts 2>&1 || echo 0)
          if [ "$new" -eq 0 ]; then
            echo "has_new=false" >> $GITHUB_OUTPUT
          else
            echo "has_new=true" >> $GITHUB_OUTPUT
          fi

      - name: Attempt merge
        if: steps.check.outputs.has_new == 'true'
        id: merge
        run: |
          set +e
          if [ "${{ inputs.strategy || 'cherry-pick' }}" = "merge" ]; then
            git merge --no-ff google/android12-5.10-lts -m "Merge android12-5.10-lts into Linux7-Staging" 2>&1 | tee /tmp/merge.log
            ec=${PIPESTATUS[0]}
          else
            base=$(git merge-base HEAD google/android12-5.10-lts 2>/dev/null || echo "")
            if [ -n "$base" ]; then
              git cherry-pick -m 1 "$base"..google/android12-5.10-lts 2>&1 | tee /tmp/merge.log
              ec=${PIPESTATUS[0]}
            else
              git diff HEAD..google/android12-5.10-lts > /tmp/lts.diff
              git apply --3way /tmp/lts.diff 2>&1 | tee /tmp/merge.log || true
              ec=1
            fi
          fi
          if grep -q "CONFLICT" /tmp/merge.log || git diff --name-only --diff-filter=U | grep -q .; then
            echo "conflict=true" >> $GITHUB_OUTPUT
          else
            if [ $ec -eq 0 ]; then
              echo "conflict=false" >> $GITHUB_OUTPUT
            else
              echo "conflict=true" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Auto-resolve conflicts via OpenRouter
        if: steps.check.outputs.has_new == 'true' && steps.merge.outputs.conflict == 'true'
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          set -e
          sudo apt-get update -qq && sudo apt-get install -y jq || true
          for f in $(git diff --name-only --diff-filter=U); do
            if [ "$f" = "Makefile" ] || file "$f" | grep -q "binary"; then
              git checkout --theirs "$f" || true
              git add "$f"
              continue
            fi
            content=$(cat "$f")
            content_trunc=${content:0:120000}
            prompt="You are a kernel merge resolver. FOCUS ON FOLLOWING LTS (google/android12-5.10-lts). Resolve git merge conflict markers <<<<<<< HEAD, =======, >>>>>>>. For version bumps (SUBLEVEL) take higher (LTS). Remove markers, return ONLY file content, no markdown.\n\nFile: $f\nContent:\n$content_trunc"
            resp=$(curl -s https://openrouter.ai/api/v1/chat/completions \
              -H "Authorization: Bearer $OPENROUTER_API_KEY" \
              -H "Content-Type: application/json" \
              -H "HTTP-Referer: https://github.com/Chor-A/Gki" \
              -d @- <<EOF
          {
            "model": "minimax/minimax-m3:free",
            "models": ["openrouter/free"],
            "messages": [{"role": "system", "content": "You ONLY resolve git merge conflict markers. Return only file content, no markdown."}, {"role": "user", "content": $(jq -Rs . <<<"$prompt")}],
            "temperature": 0.1,
            "max_tokens": 120000
          }
          EOF
            )
            resolved=$(printf "%s" "$resp" | jq -r '.choices[0].message.content // empty' || true)
            if [ -z "$resolved" ] || echo "$resolved" | grep -q "^<<<<<<< "; then
              git checkout --theirs "$f" || true
            else
              echo "$resolved" | sed -e 's/^```.*//g' -e 's/^```//g' > "$f.tmp"
              if [ $(wc -c < "$f.tmp") -gt 50 ]; then mv "$f.tmp" "$f"; else rm -f "$f.tmp"; fi
            fi
            if grep -q "^<<<<<<< " "$f"; then git checkout --theirs "$f" || true; fi
            git add "$f"
          done
          set -o pipefail
          if git cherry-pick --continue --no-edit 2>&1; then echo "ok"
          elif git commit --no-edit 2>&1; then echo "ok"
          elif git merge --continue 2>&1; then echo "ok"
          else git commit --no-edit 2>&1 || true; fi

      - name: Push
        if: steps.check.outputs.has_new == 'true'
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then exit 0; fi
          if git ls-files --unmerged | grep -q . || git diff --check 2>&1 | grep -q "conflict"; then exit 1; fi
          git push origin HEAD:Linux7-Staging || git push --force-with-lease origin HEAD:Linux7-Staging
